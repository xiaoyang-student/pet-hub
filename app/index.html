// ---------------- 各物种的粑粑造型 ----------------
function drawPoop(sp, age, t){
  switch(sp){
    case "rabbit":                     // 兔子：一小堆干球
      ctx.fillStyle = "#6b5237";
      [[-9,0],[3,-3],[10,2],[-2,4]].forEach(([a,b])=>{
        ctx.beginPath(); ctx.ellipse(a,b,5,4,0,0,7); ctx.fill(); });
      break;
    case "chicken": case "duck":       // 禽类：白色的一摊
      ctx.fillStyle = "#e9e5d7";
      ctx.beginPath(); ctx.ellipse(0,1,13,6,0,0,7); ctx.fill();
      ctx.fillStyle = "#d2ccb8";
      ctx.beginPath(); ctx.ellipse(-4,-1,5,3,0,0,7); ctx.fill();
      break;
    case "snake":                      // 蛇：细长一条
      ctx.fillStyle = "#5f4a33";
      ctx.beginPath(); ctx.ellipse(0,0,15,4,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-12,-1,4,3,0,0,7); ctx.fill();
      break;
    case "spider":                     // 蜘蛛：几粒小黑点
      ctx.fillStyle = "#2f2a22";
      [[-8,0],[-1,-3],[6,1]].forEach(([a,b])=>{
        ctx.beginPath(); ctx.arc(a,b,3.2,0,7); ctx.fill(); });
      break;
    default:                           // 猫狗：经典三层
      ctx.fillStyle = "#7a5230";
      ctx.beginPath(); ctx.ellipse(0,0,11,7,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,-6,7,5,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,-11,4,3.4,0,0,7); ctx.fill();
  }
  if(age > 1){ ctx.fillStyle="rgba(180,220,140,.8)"; ctx.font="10px system-ui";
    ctx.fillText("🪰", 8, -14 + Math.sin(t*7)*3); }
}

function shade(c, p){
  const n = parseInt(c.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  const f = v => Math.max(0, Math.min(255, Math.round(v*(1+p))));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
let hearts = [];      // 粒子

function draw(time){
  const t = time/1000;
  const keepActive = activeIdx;        // 画完一轮要还原：draw 里的 bindActive(i) 会把"当前宠物"改掉
  ctx.setTransform(DPR,0,0,DPR,0,0);   // 高分屏：内部像素 = CSS 像素 × DPR
  ctx.clearRect(0,0,W,H);

  // 排泄物（每种动物长得都不一样）
  poops.forEach(q=>{
    const age = (Date.now()-q.t)/60000;
    ctx.save(); ctx.translate(q.x, GROUND()+2);
    drawPoop(q.sp || "cat", age, t);
    ctx.restore();
  });

  // —— 每只宠物各自更新位置并画出来 ——
  for(let i = 0; i < pets.length; i++){
    const me0 = pets[i];
    if(me0.trip && me0.trip.phase === "away") continue;   // 出门在外，这会儿画不着
    bindActive(i);
    const me = pets[i];
    const held = !!(dragWho && dragWho === me.id);   // 正被捏在这只手里
    const sleeping = behavior.kind==="sleep";
    // —— 爬墙：高度和位置由自己接管，不走通用的平滑 ——
    let climbing = !!me.climb;
    if(climbing){
      const cl = me.climb, age = Date.now() - cl.t0;
      if(cl.phase === "hang"){
        me.y = me.ty = ceilYFor(me);
        // 先贴着顶边横着蹭两下（像在找落脚点）
        if(age > 400 && age < 1600) me.x = Math.max(.05, Math.min(.95, me.x + .0011 * me.dir));
        if(age >= 1600){ cl.phase = "down"; cl.t0 = Date.now(); speakOnce(T().lines.climbDown); }
      } else {
        me.y = me.ty = Math.min(cl.toY, me.y + .0032);      // 一点点往下蹭
        me.lift = 0;
        // 落地这一帧要把 climbing 也关掉：endClimb 会把 me.climb 置空，
        // 后面画姿态的代码再去读 me.climb.phase 就会抛异常，rAF 直接停摆、整个画面冻住。
        if(me.y >= cl.toY - .003){ endClimb(me); climbing = false; }
      }
      px = me.x; dir = me.dir; petLift = 0;
    }
    // 高度：朝目标高度平滑靠拢（顺着看不见的台阶往上飘，不会瞬移）
    if(!climbing && !draggingPet && me.ty != null && Math.abs(me.ty - me.y) > .0015)
      me.y += Math.sign(me.ty - me.y) * Math.min(.0055, Math.abs(me.ty - me.y));
    const slow = sick ? 0.45 : 1;
    const bb = PET_BOX[cur] || PET_BOX.cat;
    const kk = 1.25 * petScale * stageScale();
    const boxHalf = Math.max(50, Math.max(-bb[0], bb[2]) * kk + 12);
    const margin = Math.min(0.46, boxHalf / W);
    // —— 出门 / 回家：沿地面一路走到屏幕边上 ——
    let moving = behavior.kind==="walk" || behavior.kind==="fly" || behavior.kind==="hop";
    if(me.trip && !draggingPet && !climbing){
      moving = false;                       // 这一段自己走，别和普通散步叠加
      if(me.trip.phase === "out"){
        dir = me.trip.edge;
        px += .0045 * dir;
        if(px <= .008 || px >= .992){
          me.trip.phase = "away";
          me.trip.until = Date.now() + (3 + Math.random()*5) * 60000;
        }
      } else if(me.trip.phase === "back"){
        dir = -me.trip.edge;
        px += .0045 * dir;
        if(px > .07 && px < .93) endTrip(me);
      }
    }

    // —— 社交互动：先挪到对方旁边，再面对面 ——
    if(me.soc && me.soc.tx != null && !draggingPet && !climbing){
      const dx = me.soc.tx - px;
      if(Math.abs(dx) > .0015){
        px += Math.sign(dx) * Math.min(.006, Math.abs(dx));   // 走近要利索点，别磨半天
        dir = Math.sign(dx);
      }
      socialCheckReady(me);
    }
    // —— 偷指针：先悄悄蹭到指针旁边（走到了才叼） ——
    if(grab && grab.p === me && grab.phase === "approach" && !draggingPet){
      const tx = grab.cx / W, d = tx - px;
      if(Math.abs(d) > .006){
        px += Math.sign(d) * Math.min(.0055, Math.abs(d));
        dir = Math.sign(d);
        moving = false;
      } else { grab.phase = "snatch"; grab.t0 = Date.now(); }
    }
    if(moving && !draggingPet && !climbing){
      const step = behavior.kind==="fly" ? 0.0021 : behavior.kind==="hop" ? 0.0026 : 0.0016;
      px += step * dir * slow;
      if(px > 1 - margin){ px = 1 - margin; dir = -1; }
      if(px < margin){ px = margin; dir = 1; }
    }
    if(behavior.kind==="beg" && !climbing && !draggingPet && Math.abs(px-0.5)>0.03){ px += (0.5>px?1:-1)*0.0012*slow; dir = 0.5>px?1:-1; }
    if(!draggingPet && petLift > 0) petLift = Math.max(0, petLift - 14);   // 松手后落地

    // 腾空：鸡/鸭扑翅膀往上飞，猫狗兔原地小跳（都是渐变，不会瞬移）
    let airTarget = 0;
    if(!draggingPet && !climbing){
      if(behavior.kind==="fly")      airTarget = 96 + Math.sin(t*1.7)*38;
      else if(behavior.kind==="hop") airTarget = Math.abs(Math.sin(t*5.4)) * 24;
    }
    if(held) petAir = 0;                       // 被拎在手里：一点腾空残余都不能有
    else petAir += (airTarget - petAir) * 0.09;

    // 被拎着时身体一抖都不抖：呼吸/迈步/打架的这些小位移全部关掉，
    // 眼睛看到的那块像素才和指针严丝合缝（差两三像素，手感就是"发飘"）。
    const bob = held ? 0 : sleeping ? Math.sin(t*1.2)*2
      : Math.abs(Math.sin(t*(behavior.kind==="walk"?7:3.4)))*(behavior.kind==="walk"?5:2.4);
    const x = petX() + ((me.soc && me.soc.kind === "fight" && !held) ? Math.sin(t*34 + i*1.7) * 4 : 0);
    const y = petY() - bob - petLift - petAir;

    // 影子（越飞越高越小越淡，落地恢复）
    const hgt = Math.max(0, GROUND() - petYFor(me));          // 离地高度
    const liftAll = petLift + petAir + hgt * .9;
    const shadowK = Math.max(.18, 1 - liftAll/320);
    const shW = 52 * shadowK * stageScale();
    ctx.save(); ctx.globalAlpha=.3*shadowK; ctx.fillStyle="#000";
    ctx.beginPath(); ctx.ellipse(x, petY()+6, shW, 9*shadowK*stageScale(), 0,0,7); ctx.fill(); ctx.restore();

    // 老年：身上蒙一层很淡的暖灰，动作慢
    if(petStage(pets[i]) === "elder" && !sick){
      ctx.save(); ctx.globalAlpha=.14; ctx.fillStyle="#b9b2a6";
      ctx.beginPath(); ctx.ellipse(x, y-50*kk, 62*kk/1.5, 62*kk/1.5, 0,0,7); ctx.fill(); ctx.restore();
    }

    ctx.save();
    ctx.translate(x,y);
    if(climbing){
      // 贴墙的姿势：身体微微倾斜，发力时一紧一松
      const cl = me.climb;
      const down = cl && cl.phase === "down";
      const sq = Math.sin(t * (down ? 6.4 : 2.4)) * (down ? .05 : .028);
      ctx.rotate((down ? -.1 : .05) * dir + Math.sin(t * (down ? 7 : 2.6)) * .03);
      ctx.scale(dir * kk * (1 + sq), kk * (1 - sq));
    } else {
      ctx.scale(dir*kk, kk);
    }
    drawPet(SPECIES[cur], t, sleeping);
    if(behavior.kind==="fly"){   // 扑翅：脚下扬起的小风线
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2; ctx.lineCap="round";
      const f = (Math.sin(t*14)+1)/2;
      ctx.beginPath(); ctx.arc(-6, 34, 16+f*5, .2, Math.PI-.2); ctx.stroke();
    }
    ctx.restore();

    // 爬墙：脚下蹭掉的墙皮屑（一路往下掉，看得出它在使劲）
    if(climbing){
      const ks3 = stageScale();
      ctx.save();
      for(let j = 0; j < 3; j++){
        const ph = ((t * .55) + j * .33) % 1;
        ctx.globalAlpha = (1 - ph) * .5;
        ctx.fillStyle = "#cfd6e2";
        ctx.fillRect(x - 26*ks3 + j*22*ks3 + Math.sin(t*3 + j)*3,
                     y + 30*ks3 + ph * 46, 3, 5);
      }
      ctx.globalAlpha = 1;
      // 抓在天花板上的两只小爪子
      if(me.climb && me.climb.phase === "hang"){
        ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
        const ty2 = y - (PET_BOX[cur] ? -PET_BOX[cur][1] : 92) * kk + 4;
        [-1, 1].forEach(sd=>{
          ctx.beginPath();
          ctx.arc(x + sd*16*ks3, ty2 + 4, 7, Math.PI*1.05, Math.PI*1.95);
          ctx.stroke();
        });
      }
      ctx.restore();
    }

    // 生病：汗滴 + 头顶 🤒（不再是看不懂的大蓝圈）
    if(sick){
      const cyc = (t*.8)%1;
      ctx.save();
      for(let j=0;j<2;j++){
        const a = (cyc + j*.5) % 1;
        ctx.globalAlpha = 1-a;
        ctx.fillStyle = "#8fc7ff"; ctx.font = "13px system-ui";
        ctx.fillText("💧", x - 30*stageScale() + j*54*stageScale(), y - 86*stageScale() - a*26);
      }
      ctx.globalAlpha = 1;
      ctx.font = "15px system-ui"; ctx.textAlign = "center";
      ctx.fillText("🤒", x + 4, y - 108*stageScale() + Math.sin(t*2)*3);
      ctx.textAlign = "left";
      ctx.restore();
    }

    // 互动表情：吵架 💢 / 打架 💥 / 一起玩 🎵 / 蹭头 ❤️ / 闻一闻 👃 / 八卦 💬
    if(me.soc && me.soc.ready){
      const ks2 = stageScale();
      const ic = SOC_ICON[me.soc.kind] || "…";
      ctx.save();
      ctx.textAlign = "center";
      ctx.font = "20px system-ui";
      ctx.fillText(ic, x - 44*ks2, y - 108*ks2 + Math.sin(t*6)*3);
      if(me.soc.kind === "fight"){
        ctx.globalAlpha = .65 + Math.sin(t*13)*.35;
        ctx.font = "22px system-ui";
        ctx.fillText("💥", x + 30*ks2, y - 74*ks2 + Math.sin(t*11)*5);
      }
      ctx.restore();
      ctx.textAlign = "left";
    }

    // 睡眠 zzz
    if(sleeping){
      ctx.fillStyle="rgba(200,215,240,.6)"; ctx.font="600 22px system-ui";
      for(let j=0;j<3;j++){
        const a=(t*.5+j*.33)%1; ctx.globalAlpha=1-a;
        ctx.fillText("z", x+58*stageScale()+j*12, y-70*stageScale()-a*50-j*5);
      }
      ctx.globalAlpha=1;
    }
    // 饥饿提示
    if(ST.satiety<28 && !sleeping){
      ctx.fillStyle="rgba(255,180,84,.9)"; ctx.font="600 26px system-ui";
      ctx.fillText("…", x+58*stageScale(), y-60*stageScale());
    }
    // 待确认提醒：只有"主要那只"头顶挂感叹号，免得满屏都是
    if(i === activeIdx){
      let hasWait = false; TASKS.forEach(tk=>{ if(tk.status==="waiting") hasWait=true; });
      if(hasWait && t%1<0.6){ ctx.font="22px system-ui"; ctx.fillText("❗", x-64, y-64); }
    }
    flushActive();
  }

  // —— 偷指针：这一帧把指针拽到哪儿 ——
  updateGrabCursor();

  // —— 蛋：快孵化时会晃 ——
  eggs.forEach(e=>{
    const x = W*e.x, y = GROUND()+2;
    const left = Math.max(0, e.hatchAt - Date.now()) / 60000;
    const wob = left < 0.15 ? Math.sin(t*9)*3 : Math.sin(t*2)*1;
    ctx.save(); ctx.translate(x, y);
    ctx.rotate(wob * 0.02);
    ctx.fillStyle = "#fdf6e8"; ctx.strokeStyle = "#e2d6bd"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0,-20,20,26,0,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e8d9b8";
    [[-7,-26],[6,-18],[-2,-8]].forEach(([a,b])=>{ ctx.beginPath(); ctx.ellipse(a,b,3.4,4.6,0,0,7); ctx.fill(); });
    ctx.restore();
  });
  // 爱心粒子
  hearts = hearts.filter(h=>Date.now()-h.t0<1200);
  hearts.forEach(h=>{
    const p=(Date.now()-h.t0)/1200;
    ctx.globalAlpha=1-p; ctx.fillStyle="#ff8fa8"; ctx.font=`${16+h.s*8}px system-ui`;
    ctx.fillText(h.e || "♥", h.x + Math.sin(p*6+h.s*9)*14, h.y - p*70);
    ctx.globalAlpha=1;
  });

  // 气泡每帧跟着宠物（它溜达/飞/被拎起来时，对话框不会傻站在原地）
  if(pets[keepActive]) bindActive(keepActive);
  placeBubble();
}

// 限帧：拖拽/爬墙 60fps（要跟手）；正常 30fps；睡着发呆降到 15fps（省电，肉眼看不出）
let _lastFrame = 0;
function loop(time){
  // 以前拖拽时如果宠物正好在 idle/sleep，会被压到 15fps，
  // 手在屏幕上走 60fps、宠物只跳 15 帧，怎么调都"跟不上手"。
  const busy = draggingPet || pets.some(p => p.climb);
  const still = !busy && (behavior.kind === "sleep" || behavior.kind === "idle")
                && petAir < 1 && !el("bubble").classList.contains("show");
  const frame = busy ? 16 : (still ? 66 : 33);
  if(time - _lastFrame >= frame){
    _lastFrame = time;
    // 单帧异常不能拖垮整个动画：以前 draw 里抛一次错，requestAnimationFrame 就再也不会被排上，
    // 画面直接冻在最后一帧（而且看起来像"宠物凭空消失了"）。
    try { draw(time); }
    catch(e){ if(window.petHub && window.petHub.trace) window.petHub.trace("DRAWERR " + e.message); }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------------- 绘制宠物（复用 tiny-lm 造型） ----------------
function eyes(open,t){
  if(open){
    ctx.fillStyle="#0b0e14";
    const bl=(t%4.2)<.12?.15:1;
    ctx.beginPath(); ctx.ellipse(-13,-8,5,5*bl,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(13,-8,5,5*bl,0,0,7); ctx.fill();
  } else {
    ctx.strokeStyle="#0b0e14"; ctx.lineWidth=3; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(-13,-8,6,.15,Math.PI-.15); ctx.stroke();
    ctx.beginPath(); ctx.arc(13,-8,6,.15,Math.PI-.15); ctx.stroke();
  }
}
function bodyEllipse(w,h,c,y=0){ ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,y,w,h,0,0,7); ctx.fill(); }
// 腿部：walking 时前后摆动；spec = [[x, y0, y1, 线宽, 相位], ...]
function legs(color, t, spec, sleeping){
  const walking = !sleeping && (behavior.kind === "walk" || behavior.kind === "play");
  ctx.strokeStyle = color; ctx.lineCap = "round";
  spec.forEach(([x, y0, y1, w, ph], i) => {
    const swing = walking ? Math.sin(t * 7 + (ph || i) * Math.PI) * 6 : 0;
    ctx.lineWidth = w || 9;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + swing, y1); ctx.stroke();
  });
}
// 蹼足 / 鸡爪
function webFoot(color, x, y, s){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x - 11*s, y); ctx.lineTo(x + 11*s, y);
  ctx.lineTo(x + 4*s, y + 9*s); ctx.lineTo(x - 4*s, y + 9*s); ctx.closePath(); ctx.fill();
}

function drawPet(s,t,sleeping){
  const c=s.accent, dark=shade(c,-.35), light=shade(c,.18);
  switch(cur){
    case "cat":
      legs(dark, t, [[-36,14,44,9,0],[-20,14,44,9,1]], sleeping);   // 后腿
      legs(c,    t, [[20,14,44,9,1],[34,14,44,9,0]], sleeping);     // 前腿
      ctx.strokeStyle=c; ctx.lineWidth=11; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(58,4);
      ctx.quadraticCurveTo(96,-18+Math.sin(t*2.2)*10,84,-54); ctx.stroke();
      bodyEllipse(66,42,c); bodyEllipse(52,30,light);
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,-34,32,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-28,-54); ctx.lineTo(-34,-86); ctx.lineTo(-8,-66); ctx.fill();
      ctx.beginPath(); ctx.moveTo(28,-54); ctx.lineTo(34,-86); ctx.lineTo(8,-66); ctx.fill();
      eyes(!sleeping,t);
      ctx.fillStyle="#e8837a"; ctx.beginPath(); ctx.arc(0,-24,3.4,0,7); ctx.fill();
      break;
    case "dog":
      legs(dark, t, [[-38,16,46,10,0],[-20,16,46,10,1]], sleeping);
      legs(c,    t, [[22,16,46,10,1],[38,16,46,10,0]], sleeping);
      ctx.strokeStyle=c; ctx.lineWidth=13; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(62,0);
      ctx.quadraticCurveTo(98,-10+Math.sin(t*7)*18,90,-40); ctx.stroke();
      bodyEllipse(72,44,c); bodyEllipse(56,30,light);
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,-38,36,0,7); ctx.fill();
      ctx.fillStyle=dark;
      ctx.beginPath(); ctx.ellipse(-42,-38,15,29,.32,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(42,-38,15,29,-.32,0,7); ctx.fill();
      eyes(!sleeping,t);
      ctx.fillStyle=light; ctx.beginPath(); ctx.ellipse(20,-24,18,12,0,0,7); ctx.fill();
      ctx.fillStyle="#2a1c17"; ctx.beginPath(); ctx.ellipse(34,-27,5.5,4.5,0,0,7); ctx.fill();
      break;
    case "chicken":
      legs("#e8b45a", t, [[-10,24,40,5,0],[12,24,40,5,1]], sleeping);
      webFoot("#f2b53c", -10, 40, 1); webFoot("#f2b53c", 12, 40, 1);
      bodyEllipse(48,40,c);
      ctx.fillStyle=light; ctx.beginPath(); ctx.ellipse(-6,4,32,24,0,0,7); ctx.fill();
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(24,-30,22,0,7); ctx.fill();
      ctx.fillStyle="#e05a4f"; ctx.beginPath();
      ctx.arc(16,-52,7,0,7); ctx.arc(26,-56,8,0,7); ctx.arc(36,-52,7,0,7); ctx.fill();
      ctx.fillStyle="#f2b53c"; ctx.beginPath();
      ctx.moveTo(44,-32); ctx.lineTo(62,-27); ctx.lineTo(44,-22); ctx.fill();
      eyes(!sleeping,t); break;
    case "duck":
      legs("#f2a03c", t, [[-8,6,34,6,0],[10,6,34,6,1]], sleeping);
      webFoot("#f2b53c", -8, 34, 1.1); webFoot("#f2b53c", 10, 34, 1.1);
      bodyEllipse(56,36,c,6);
      ctx.fillStyle=light; ctx.beginPath(); ctx.ellipse(-8,10,38,20,0,0,7); ctx.fill();
      ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(20,-8);
      ctx.quadraticCurveTo(44,-52,58,-44); ctx.lineTo(66,-22);
      ctx.quadraticCurveTo(52,-16,40,12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(60,-46,18,0,7); ctx.fill();
      ctx.fillStyle="#f2b53c"; ctx.beginPath(); ctx.roundRect(70,-50,30,10,5); ctx.fill();
      eyes(!sleeping,t); break;
    case "rabbit":
      legs(dark, t, [[-26,10,42,13,0],[-6,10,42,13,1]], sleeping);   // 后腿粗壮
      legs(c,    t, [[24,14,44,8,1],[36,14,44,8,0]], sleeping);      // 前腿短
      ctx.fillStyle=light; ctx.beginPath(); ctx.arc(-58,8,13,0,7); ctx.fill();
      bodyEllipse(48,42,c);
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(6,-34,28,0,7); ctx.fill();
      ctx.save(); ctx.translate(2,-56); ctx.rotate(-.14);
      ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(-8,-34,9,34,0,0,7); ctx.fill();
      ctx.fillStyle="#f6bccd"; ctx.beginPath(); ctx.ellipse(-8,-34,4.5,26,0,0,7); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(16,-56); ctx.rotate(.16);
      ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(8,-34,9,34,0,0,7); ctx.fill();
      ctx.fillStyle="#f6bccd"; ctx.beginPath(); ctx.ellipse(8,-34,4.5,26,0,0,7); ctx.fill();
      ctx.restore();
      eyes(!sleeping,t);
      ctx.fillStyle="#e88ca8"; ctx.beginPath(); ctx.arc(6,-24,3,0,7); ctx.fill();
      break;
    case "snake": {
      ctx.strokeStyle=c; ctx.lineWidth=17; ctx.lineCap="round";
      ctx.beginPath();
      const sway=Math.sin(t*1.4)*6;
      ctx.moveTo(-90,18);
      ctx.bezierCurveTo(-60,62,10,62,30,26);
      ctx.bezierCurveTo(46,-4,-10,-24,-30,4);
      ctx.bezierCurveTo(-44,24,6,30,26,6+sway);
      ctx.stroke();
      ctx.fillStyle=light; ctx.beginPath(); ctx.ellipse(30,4+sway,17,12,-.4,0,7); ctx.fill();
      eyes(!sleeping,t); break; }
    case "spider":
      ctx.strokeStyle=dark; ctx.lineWidth=6; ctx.lineCap="round";
      for(let i=0;i<4;i++){
        const side=i<2?-1:1;
        for(let j=0;j<2;j++){
          ctx.beginPath(); ctx.moveTo(side*10,-4);
          ctx.lineTo(side*(44+j*26), -22+Math.sin(t*2+i+j)*7+j*30);
          ctx.stroke();
        }
      }
      ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,-6,26,22,0,0,7); ctx.fill();
      ctx.fillStyle=light; ctx.beginPath(); ctx.arc(0,-34,14,0,7); ctx.fill();
      if(!sleeping){ ctx.fillStyle="#1a1020";
        [[-6,-36],[6,-36],[-6,-31],[6,-31]].forEach(([a,b])=>{
          ctx.beginPath(); ctx.arc(a,b,2,0,7); ctx.fill(); }); }
      break;
  }
}

// ---------------- 交互：点击 / 右键 / 清理 ----------------
let cur = "cat";

// 命中哪一只？返回下标（-1 = 没点到）。只做判断，不改当前宠物。
function hitPet(mx,my){
  for(let i = pets.length - 1; i >= 0; i--){
    const p = pets[i];
    if(p.trip && p.trip.phase === "away") continue;      // 出门了，点不到
    const b = petBoxFor(p);
    if(mx >= b.left && mx <= b.right && my >= b.top && my <= b.bottom) return i;
  }
  return -1;
}
function hitPoop(mx,my){
  return poops.findIndex(p => Math.abs(p.x-mx)<28 && Math.abs(my-(GROUND()+2))<30);
}

// Electron 悬浮窗：document 级判定指针是否在可交互区（HUD/菜单/宠物/排泄物）
const wvHost = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;   // WebView2 壳
document.addEventListener("mousemove", e=>{
  // 拖拽期间跳过每帧命中判定：一次手势里会来上百条 move，
  // 每条都去算 hitPet + 发一次 setInteractive，白占主线程、还拖慢跟手。
  if(draggingPet) return;
  const overUI = !!(e.target.closest && e.target.closest("#hud,#menu,#bubble,#toasts"));
  const hit = overUI || hitPet(e.clientX,e.clientY) >= 0 || hitPoop(e.clientX,e.clientY)>=0;
  cv.style.cursor = hit ? "pointer" : "default";
  if(window.petHub) window.petHub.setInteractive(hit);
  else if(wvHost) wvHost.postMessage(hit ? "hit:1" : "hit:0");
}, {passive:true});

// 诊断探针：确认壳转发过来的点击到底落在哪个元素（默认不写日志）
document.addEventListener("click", e=>{
  if(window.petHub && window.petHub.trace){
    const t = e.target;
    window.petHub.trace("docclick " + Math.round(e.clientX) + "," + Math.round(e.clientY)
      + " @" + ((t && (t.id || t.tagName)) || "?"));
  }
}, true);

cv.addEventListener("click", e=>{
  if(window.petHub && window.petHub.trace)
    window.petHub.trace("cvclick " + Math.round(e.clientX) + "," + Math.round(e.clientY));
  const pi = hitPoop(e.clientX,e.clientY);
  if(pi>=0){ cleanPoop(pi); return; }
  const who = hitPet(e.clientX,e.clientY);
  if(who >= 0 && !dragMovedFar){
    bindActive(who);
    hearts.push({x:petX(), y:petY()-90, t0:Date.now(), s:Math.random()});
    ST.mood = Math.min(100, ST.mood + 1.5);
    if(Math.random()<.35) say(spLine("pet"));
    flushActive();
    reportRects(true);
  }
});

// ---------------- 叼走指针：趁你不在，偷偷把鼠标叼走玩一会儿 ----------------
// 真的会挪动系统指针（壳层 SetCursorPos）。所以规矩定死：
//   · 只有连续 12 秒没碰鼠标才动手；· 4~10 分钟最多一次；
//   · 你一动鼠标 / 一点击，壳层立刻喊 grab:lost，它马上松口。
let grab = null, grabPending = false;
let grabNextAt = Date.now() + 150000;
let lastCursorInfo = null;

function hasShell(){ return !!(window.chrome && window.chrome.webview); }
function sendWarp(x, y){
  try { if(hasShell()) window.chrome.webview.postMessage("warp:" + Math.round(x) + "," + Math.round(y)); } catch(e){}
}
function requestCursor(){
  if(!hasShell()) return false;
  try { window.chrome.webview.postMessage("cursor?"); return true; } catch(e){ return false; }
}
// 嘴的位置：脸的下方偏前（指针就叼在这儿）
function petMouth(p){
  const b = PET_BOX[p.sp] || PET_BOX.cat;
  const s = 1.25 * petScale * (STAGE_SCALE[petStage(p)] || 1);
  const cx = W * p.x, base = petYFor(p) - 8 - p.lift - p.air;
  return { x: cx + p.dir * 26 * s, y: base - 44 * s };
}
function maybeStealCursor(){
  if(grab || grabPending) return;
  if(Date.now() < grabNextAt) return;
  if(!hasShell() || draggingPet) return;
  const cand = pets.filter(p => !p.trip && !p.soc && !p.climb
                             && p.beh.kind !== "sleep" && (p.y == null ? 1 : p.y) > .8);
  if(!cand.length) return;
  // 不是每次都干：先问一下指针在哪儿、你闲了多久
  grabNextAt = Date.now() + 90000 + Math.random() * 120000;
  grabPending = requestCursor();
  setTimeout(()=>{ grabPending = false; }, 1200);
}
function tryStartGrab(){
  grabPending = false;
  const ci = lastCursorInfo;
  if(!ci || Date.now() - ci.t > 1800) return;
  if(ci.idle < 20000) return;                        // 人还在用电脑（或者正在读东西），别捣乱
  if(ci.y < H * 0.42) return;                        // 指针在高处，够不着
  const cand = pets.filter(p => !p.trip && !p.soc && !p.climb
                             && p.beh.kind !== "sleep" && (p.y == null ? 1 : p.y) > .8);
  if(!cand.length) return;
  // 挑离指针最近的那只
  const p = cand.reduce((a, b) =>
    Math.abs(W * a.x - ci.x) < Math.abs(W * b.x - ci.x) ? a : b);
  if(Math.abs(W * p.x - ci.x) > 460) return;          // 太远就不追了
  grab = { p, phase:"approach", t0: Date.now(), cx: ci.x, cy: ci.y };
  try { window.petHub.trace("grab approach px=" + Math.round(W*p.x) + " cx=" + Math.round(ci.x)); } catch(_){}
  grabNextAt = Date.now() + 240000 + Math.random() * 360000;
  p.beh = { kind:"walk", until: now() + 14 };
  bindActive(pets.indexOf(p));
}
function endGrab(ok){
  const p = grab && grab.p;
  grab = null;
  try { window.petHub.trace("grab end ok=" + ok); } catch(_){}
  try { if(hasShell()) window.chrome.webview.postMessage("release"); } catch(e){}
  if(p && pets.includes(p)){
    p.beh = { kind:"idle", until: now() + 2 };
    say(ok ? T().lines.grabDrop : T().lines.grabLost, T().lines.grabTag, p);
  }
  reportRects(true);
  saveState();
}
function updateGrabCursor(){
  const g = grab;
  if(!g) return;
  const p = g.p;
  if(!pets.includes(p)){ grab = null; try { if(hasShell()) window.chrome.webview.postMessage("release"); } catch(e){} return; }
  const m = petMouth(p);
  if(g.phase === "snatch"){
    // 320ms 拽到嘴边：像"被叼住"，而不是指针凭空瞬移
    g.cx += (m.x - g.cx) * .3;
    g.cy += (m.y - g.cy) * .3;
    sendWarp(g.cx, g.cy);
    if(Date.now() - g.t0 > 340){
      g.phase = "carry"; g.t0 = Date.now();
      g.holdUntil = Date.now() + 2200 + Math.random() * 2000;
      say(T().lines.grabBite, T().lines.grabTag, p);
      try { window.petHub.trace("grab carry mouth=" + Math.round(m.x) + "," + Math.round(m.y)); } catch(_){}
      p.beh = { kind:"walk", until: now() + 8 };
    }
  } else if(g.phase === "carry"){
    sendWarp(m.x, m.y);
    g.cx = m.x; g.cy = m.y;
    if(Date.now() > g.holdUntil) endGrab(true);
  }
}

// ---------------- 前后层：宠物可以站在窗口前面，也可以躲到桌面层 ----------------
// 前置＝永远置顶；后置＝压在普通窗口下面，点开别的应用就看不见它（桌面还在）
let petLayer = (typeof window.petHubLayer === "string" && window.petHubLayer === "back") ? "back" : "front";
function toggleLayer(){
  const back = petLayer !== "back";
  petLayer = back ? "back" : "front";
  try { if(window.petHub && window.petHub.setLayer) window.petHub.setLayer(back); } catch(e){}
  say(back ? T().lines.layerToBack : T().lines.layerToFront, T().lines.layerTag);
}
if(window.chrome && window.chrome.webview)
  window.chrome.webview.addEventListener("message", e=>{
    const m = e && e.data;
    if(m === "layer:back") petLayer = "back";
    else if(m === "layer:front") petLayer = "front";
    else if(m === "grab:lost"){ if(grab) endGrab(false); }
    else if(typeof m === "string" && m.startsWith("cursor:")){
      const a = m.slice(7).split(",").map(Number);
      lastCursorInfo = { x: a[0], y: a[1], idle: a[2] || 0, t: Date.now() };
      if(grabPending) tryStartGrab();
    }
  });

// 双击宠物＝切换前后层（比往右键菜单里再堆一项更顺手）
cv.addEventListener("dblclick", e=>{
  if(dragMovedFar) return;                 // 刚拖过一场，别把"松手"当成双击
  if(hitPet(e.clientX, e.clientY) < 0) return;
  toggleLayer();
});

// ---------------- 拖拽：拎起宠物（拖到屏幕外面＝把它放走了） ----------------
let dragMovedFar = false;
let dragTrack = 0;             // 本次拖拽累计水平位移（松手后据此定朝向）
let lastHeldSay = 0;
// 拖拽跟手诊断：只有 PETHUB_DBG=1 启动时才写日志，正常使用零输出。
const DRAG_DBG = !!window.PETHUB_DBG;
let dragDbgLast = 0;
function dragDbg(s){ try { if(DRAG_DBG && window.petHub && window.petHub.trace) window.petHub.trace(s); } catch(e){} }
// 基准高度已经贴到天花板（y=0）之后，还能再往上拎多少。
// 以前这个上限是按"宠物当前高度"算的，于是站在高处的宠物往上拖两下就顶死了，
// 往下拖更是一点都动不了（lift 不能为负）—— 那堵"看不见的墙"就是这么来的。
function dragLiftMax(p){
  const b = PET_BOX[p.sp] || PET_BOX.cat;
  const s = 1.25 * petScale * (STAGE_SCALE[petStage(p)] || 1);
  // 头顶 = 脚底 + b[1]*s（b[1] 是负的，往上）。让它最多越出屏幕顶边 30px
  return Math.max(70, 30 - (TOP_Y() - 8) - b[1] * s);
}
// 脚底在屏幕上的绝对纵坐标：y=0 贴天花板，y=1 站地面
const FOOT_TOP  = () => TOP_Y() - 8;
const FOOT_BASE = () => GROUND() - 8;
cv.addEventListener("mousedown", e=>{
  const who = hitPet(e.clientX,e.clientY);
  if(e.button!==0 || who < 0) return;
  if(dragCleanup) dragCleanup();              // 上一次没收到 mouseup 就先收尾，避免挂上第二套监听互相打架
  bindActive(who);
  const target = pets[who];
  if(!target) return;
  draggingPet = true; dragMovedFar = false; kickWarned = false;
  dragWho = target.id; dragTrack = 0;
  target.air = 0;                 // 拎起来就落地为零，命中框和画面对得上
  // —— 抓取点锁定 ——
  // 全程按"指针位移增量"算，不做任何"把宠物对齐到指针"的换算。
  // 以前纵向写的是 lift = petYFor - 8 - clientY（脚底对准指针），一按下宠物就整体往下跳：
  // 你捏的是它脑袋，它却把脚挪到你指尖，差出一百多像素，怎么拖都觉得"没跟手"。
  // 现在按下那一刻的相对位置原样保留，宠物就是被捏住的那一块，1:1 跟手。
  const gx = e.clientX, gy = e.clientY;
  const gpx = target.x, glift = target.lift;
  // 正挂在墙上（被扔到天花板后往下爬）时，高度由爬墙逻辑独占，拖它没反应。
  // 手一抓上去就让它脱手，交还给指针。
  if(target.climb){ target.climb = null; target.beh = { kind:"idle", until: now()+2 }; }
  const lmax = dragLiftMax(target);
  // 起始脚底（屏幕绝对坐标）。纵向全程按这个值的位移增量走，
  // 先落在基准高度 y 上，顶到天花板之后多出来的才交给 lift。
  const startFoot = petYFor(target) - 8 - target.lift;
  const footMin = FOOT_TOP() - lmax, footMax = FOOT_BASE();
  if(DRAG_DBG) dragDbg("DRAG start gx=" + Math.round(gx) + " gy=" + Math.round(gy)
    + " petcx=" + Math.round(gpx * W) + " glift=" + Math.round(glift)
    + " lmax=" + Math.round(lmax) + " W=" + W + " H=" + H);
  const place = (cx, cy)=>{
    dragTrack = cx - gx;
    // 允许拖到屏幕外面一点：越过边缘松手就当它走了
    target.x = Math.max(-.07, Math.min(1.07, gpx + dragTrack / W));
    // 纵向：脚底跟着手走。先动"站在哪一层"（y），层到底了（贴天花板）再往上拎（lift）。
    // 这样从半空一路拖回地面是连续的，不会在中途卡住。
    const foot = Math.max(footMin, Math.min(footMax, startFoot + (cy - gy)));
    const span = GROUND() - TOP_Y();
    if(foot <= FOOT_TOP()){
      target.y = 0;
      target.lift = Math.min(lmax, FOOT_TOP() - foot);
    } else {
      target.y = Math.min(1, (foot - FOOT_TOP()) / span);
      target.lift = 0;
    }
    // ty 不跟着走的话，松手后行为机会把高度平滑拉回旧目标，等于白拖
    target.ty = target.y;
    // 同步一份到投影变量，这一帧的绘制/气泡位置立刻跟上
    if(pets[activeIdx] === target){ px = target.x; petLift = target.lift; }
    // ox / oy = 指针相对"宠物中心 / 宠物脚底"的偏移。拖拽全程它俩必须是个常数，
    // 一旦开始漂移就说明宠物没跟着手走（这条日志就是判断"跟不跟手"的硬指标）。
    if(DRAG_DBG){
      const nw = Date.now();
      if(nw - dragDbgLast > 70){
        dragDbgLast = nw;
        dragDbg("DRAG ox=" + Math.round(cx - W*target.x)
              + " oy=" + Math.round(cy - (petYFor(target) - 8 - target.lift))
              + " lift=" + Math.round(target.lift) + " x=" + target.x.toFixed(4)
              + " y=" + (target.y == null ? 1 : target.y).toFixed(4));
      }
    }
  };
  const move = ev=>{
    if(!draggingPet) return;
    place(ev.clientX, ev.clientY);
    if(!dragMovedFar && (Math.abs(dragTrack) > 6 || Math.abs(ev.clientY - gy) > 6)) dragMovedFar = true;
    // 拖拽期间**不碰朝向**：竖着拎时水平位移在 0 附近抖 ±1px，每帧翻面会让身体左右跳
    //（尾巴/喙左右不对称，视觉上能跳几十像素）。朝向只在松手时按总位移定一次。
    if(target.lift > 150 && Date.now() - lastHeldSay > 6000){
      lastHeldSay = Date.now();
      say(target.sp === "cat" ? T().lines.heldHighCat : T().lines.heldHigh, null, target);
    }
    // 快到边上了先警告一次，免得一松手就没了
    if(!kickWarned && (target.x < .045 || target.x > .955)){
      kickWarned = true;
      say(T().lines.kickWarn, T().lines.kickedTag, target);
    }
  };
  const stop = ()=>{
    draggingPet = false;
    dragWho = null;
    removeEventListener("mousemove",move);
    removeEventListener("mouseup",up);
    removeEventListener("blur",up);
    if(dragCleanup === stop) dragCleanup = null;
  };
  const up = (ev)=>{
    if(!draggingPet) return;
    // 抬手那一瞬再按抬起点校正一次：甩得快时最后一个 mousemove 可能还停在半路，
    // 不校正就会"扔上去了却没抓住"。
    if(ev && typeof ev.clientY === "number" && typeof ev.clientX === "number")
      place(ev.clientX, ev.clientY);
    stop();
    // pdx 是手的水平位移，petdx 是宠物实际平移量，两者应该相等（除拖到屏幕边缘被夹住）
    if(DRAG_DBG) dragDbg("DRAG end pdx=" + Math.round(dragTrack)
      + " petdx=" + Math.round((target.x - gpx) * W)
      + " petdy=" + Math.round(target.lift - glift)
      + " lift=" + Math.round(target.lift));
    if(Math.abs(dragTrack) > 26) target.dir = dragTrack > 0 ? 1 : -1;
    // 拖出屏幕边缘：它自己走掉了，不会再回来
    if(target.x <= .015 || target.x >= .985){ kickOut(target); return; }
    // 拖到天花板附近松手：它一把抓住顶边，再顺墙爬下来
    if(dragMovedFar && headTopOf(target, target.lift) < TOP_Y() + 34){
      target.lift = 0;
      startClimb(target);
      bindActive(pets.indexOf(target));
      return;
    }
    if(dragMovedFar){
      target.beh = {kind:"idle", until: now()+2};
      target.st.mood = Math.min(100, target.st.mood + (target.lift > 100 ? -2 : 1));
      if(target.lift > 100)
        setTimeout(()=>say(target.sp === "cat" ? T().lines.droppedCat : T().lines.dropped, null, target), 600);
    }
    bindActive(pets.indexOf(target));
    reportRects(true);
  };
  dragCleanup = stop;
  addEventListener("mousemove",move); addEventListener("mouseup",up);
  addEventListener("blur",up);       // 焦点丢了（切窗口/被别的程序抢走）也要收手，否则会一直黏着
  e.preventDefault();
});

// 被拖出屏幕：放它走（永久离开，不会自己回来）
function kickOut(p){
  if(!p) return;
  const idx = pets.indexOf(p);
  if(idx < 0) return;
  const nm = spNameOf(p);
  pets.splice(idx, 1);
  graveyard.push({ sp:p.sp, born:p.born, died:Date.now(), reason:"kicked" });
  if(p.soc){
    const mate = pets.find(x => x.id === p.soc.with);
    if(mate){ mate.soc = null; if(mate.beh.kind === "social") mate.beh = { kind:"idle", until: now()+1 }; }
    p.soc = null;
  }
  if(activeIdx >= pets.length) activeIdx = Math.max(0, pets.length - 1);
  if(pets.length) bindActive(activeIdx);
  say(T().lines.kicked(nm), T().lines.kickedTag);
  toast(`<b>🚪</b> ${T().lines.kicked(nm)}`);
  reportRects(true);
  saveState();
}

// ---------------- 拖拽：HUD 面板与 mini 圆钮 ----------------
function makeDraggable(target, handle, storeKey){
  handle.addEventListener("mousedown", e=>{
    if(e.button!==0) return;
    e.stopPropagation();
    const r = target.getBoundingClientRect();
    const sx=e.clientX, sy=e.clientY, ox=r.left, oy=r.top;
    let moved=false;
    const move = ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved && Math.hypot(dx,dy)<5) return;
      moved=true;
      target.style.left = Math.max(0, Math.min(innerWidth-40, ox+dx))+"px";
      target.style.top  = Math.max(0, Math.min(innerHeight-40, oy+dy))+"px";
      target.style.right = "auto";
    };
    const up = ()=>{
      removeEventListener("mousemove",move); removeEventListener("mouseup",up);
      if(moved){ hudJustDragged = true; setTimeout(()=>hudJustDragged=false, 200);
        try{ localStorage.setItem(storeKey,
        JSON.stringify({left:target.style.left, top:target.style.top})); }catch(_){}}
    };
    addEventListener("mousemove",move); addEventListener("mouseup",up);
    e.preventDefault();
  });
}
function restorePos(target, storeKey){
  try{
    const p = JSON.parse(localStorage.getItem(storeKey)||"null");
    if(p && p.left && p.top){ target.style.left=p.left; target.style.top=p.top; target.style.right="auto"; }
  }catch(_){}
}
restorePos(el("hud"), "pethub_hud_pos");
makeDraggable(el("hud"), el("hudHead"), "pethub_hud_pos");
makeDraggable(el("hud"), el("hudShow"), "pethub_hud_pos");
placeHudPanel();
addEventListener("resize", ()=>{ placeHudPanel(); if(el("bubble").classList.contains("show")) placeBubble(); });

cv.addEventListener("contextmenu", e=>{
  e.preventDefault();
  const pi = hitPoop(e.clientX,e.clientY);
  if(pi>=0){ cleanPoop(pi); return; }
  const who = hitPet(e.clientX,e.clientY);
  if(who >= 0){ menuPet = pets[who]; bindActive(who); openMenu(e.clientX,e.clientY); }
  else closeMenu();
});
addEventListener("click", e=>{ if(!e.target.closest("#menu")) closeMenu(); });

function cleanPoop(i){
  const q = poops[i];
  poops.splice(i,1);
  ST.hygiene = Math.min(100, ST.hygiene+3);
  ST.mood = Math.min(100, ST.mood+1);
  // 扫掉的瞬间冒几粒小灰
  if(q) for(let k=0;k<4;k++)
    hearts.push({ x:q.x + Math.random()*24-12, y:GROUND()-12, t0:Date.now(), s:Math.random(), e:"✨" });
  say(spLine("clean"), T().lines.cleanedTag);
  reportRects(true);
}

function actions(){
  const A = T().actions, L = T().lines, S = T().stats;
  const raw = [
    [A.feed, ()=>{ ST.satiety=Math.min(100,ST.satiety+42);
        poopCooldown = 18 + Math.random()*20;
        say(Math.random()<.5 ? L.feed : L.thanks, S.satiety+" "+Math.round(ST.satiety)); }],
    [A.pet, ()=>{ ST.mood=Math.min(100,ST.mood+6);
        for(let i=0;i<4;i++) hearts.push({x:petX()+Math.random()*60-30, y:petY()-80, t0:Date.now(), s:Math.random()});
        say(spLine("pet"), S.mood+" "+Math.round(ST.mood)); }],
    [A.play, ()=>{ if(ST.energy<12){ say(L.tooTired); return; }
        ST.mood=Math.min(100,ST.mood+7); ST.energy=Math.max(0,ST.energy-9);
        behavior={kind:"play", until:now()+4};
        say(spLine("play")); }],
    [A.bath, ()=>{ ST.hygiene=100; poops=poops.slice(0,Math.ceil(poops.length/2));
        say(spLine("clean"), L.cleanFull); }],
    [A.sleep, ()=>{ behavior={kind:"sleep", until:now()+10}; say(L.sleep); }],
    ["SEP"],
    [A.vet, ()=>{ if(!sick){ say(L.healthy, S.health+" "+Math.round(ST.health)); return; }
        sick=false; ST.health=100; ST.mood=Math.min(100,ST.mood+10);
        say(L.recovered, L.recoveryTag); }],
    ["SEP"],
    // 多只时用不着"下一只"——右键点谁就是对谁操作（menuTarget 会切回目标）
    ...(pets.length > 1 ? [] : [[A.swap, ()=>{
        const ks=Object.keys(SPECIES);
        cur = ks[(ks.indexOf(cur)+1)%ks.length];
        if(pets[0]) pets[0].sp = cur;                 // 单只时换的是物种本体
        poops=[]; sick=false; ST.health=100; ST.satiety=72; ST.energy=80; ST.mood=75; ST.hygiene=88;
        petAir = 0; _faceCur = ""; setHudFace();           // 小球图案跟着换
        say(L.switched(spName()), L.switchTag);
        reportRects(true); }]]),
    [A.lang, ()=>{ setLang(LANG === "zh" ? "en" : "zh"); }],
  ];
  // 去掉多余的空分隔：连续的两个、开头的、末尾的都清掉
  const items = [];
  for(const it of raw){
    const isSep = it === "SEP" || (Array.isArray(it) && it[0] === "SEP");
    if(isSep){
      if(!items.length || items[items.length-1] === "SEP") continue;
      items.push("SEP"); continue;
    }
    items.push(it);
  }
  while(items.length && items[items.length-1] === "SEP") items.pop();
  return items.map(it => (Array.isArray(it) && typeof it[1] === "function")
    ? [it[0], () => { menuTarget(); it[1](); }] : it);
}

// ---------------- 语言切换（UI + 台词 + 状态文案 全部同时切） ----------------
function setLang(l){
  LANG = (l === "en") ? "en" : "zh";
  try { if(window.petHub && window.petHub.setLang) window.petHub.setLang(LANG); } catch(e){}
  applyLang();
}
function applyLang(){
  const u = T().ui;
  const t = document.querySelector("#hud .hud-head .t"); if(t) t.textContent = u.hudTitle;
  const c = el("hudHide"); if(c) c.textContent = u.collapse;
  if(!bridgeOnline) el("noteLine").textContent = (DEMO_ENABLED && demoTimer) ? u.demo : u.offline;
  _faceCur = ""; setHudFace();
  renderHUD();
  say(T().lines.greeting, spName());
}

function openMenu(x,y){
  const m = el("menu");
  m.innerHTML = actions().map(a=> a[0]==="SEP" ? `<div class="sep"></div>` :
    `<div class="mi">${a[0]}</div>`).join("");
  const items=[...m.querySelectorAll(".mi")];
  let ai=0;
  actions().forEach(a=>{ if(a[0]==="SEP") return; const node=items[ai++]; node.onclick=()=>{ a[1](); closeMenu(); }; });
  m.style.display="block";
  // 按菜单真实尺寸夹住位置：项变多了以后，写死 320 会让底部一截跑到屏幕外
  const mw = m.offsetWidth || 170, mh = m.offsetHeight || 320;
  m.style.left = Math.max(6, Math.min(innerWidth  - mw - 8, x + 6)) + "px";
  m.style.top  = Math.max(6, Math.min(innerHeight - mh - 8, y + 6)) + "px";
  if(window.petHub) window.petHub.setInteractive(true);
}
function closeMenu(){
  el("menu").style.display="none";
  // 必须复位：否则壳会一直以为"点在菜单上"，把整屏点击全吞掉（那层隐藏的墙）
  if(window.petHub) window.petHub.setInteractive(false);
  reportRects(true);
}

// ---- 再点一次桌面快捷方式：又来一只（不用在菜单里堆选项） ----
window.pethubCount = function(){ return pets.length; };
window.pethubSpawn = function(){
  if(pets.length >= MAX_PETS){ say(T().lines.spawnFull); return; }
  const ks = Object.keys(SPECIES);
  const sp = ks[Math.floor(Math.random()*ks.length)];
  const p = spawnPet(sp, Math.max(.1, Math.min(.9, (pets.length ? pets[pets.length-1].x : .5) + (Math.random()*.3-.15))));
  if(!p) return;
  activeIdx = pets.indexOf(p);
  bindActive(activeIdx);
  for(let i=0;i<6;i++)
    hearts.push({x:petX()+Math.random()*60-30, y:petY()-80, t0:Date.now(), s:Math.random()});
  say(T().lines.spawnNew(SPECIES[sp].name));
  flushActive();
  reportRects(true);
  setHudFace();
};

// ---- 同步命中矩形：把可交互区域直接交给壳做本地判定 ----
// 之前只靠 setInteractive 单向声明，菜单关闭后忘了复位就会永久卡在"全屏拦截"。
// 现在页面每 200ms（或有变化时）把真实矩形告诉壳，点击判定纯本地、同步、无状态残留。
let lastRectSig = "";
window.pethubRects = function(){
  const out = [];
  const add = (tag, b) => {
    if(b.width > 1 && b.height > 1)
      out.push(tag + ":" + Math.round(b.left) + "," + Math.round(b.top)
               + "," + Math.round(b.width) + "," + Math.round(b.height));
  };
  // HUD 只上报"真正看得见的那块"：
  // 展开 → 面板本身；收起 → 那颗小球。以前上报的是 #hud 外层盒子（宽度等于面板宽），
  // 收起后右侧会留出一大片隐形却吞点击的区域。
  const hud = el("hud");
  if(hud && !hud.classList.contains("hidden")){
    const panel = hud.querySelector(".hud-panel");
    if(panel) add("hud", panel.getBoundingClientRect());
  } else if(hud){
    const ball = el("hudShow");
    if(ball) add("hud", ball.getBoundingClientRect());
  }
  for(const id of ["menu"]){
    const e = el(id); if(!e) continue;
    if(e.style.display === "none") continue;
    add(id, e.getBoundingClientRect());
  }
  // 气泡是 pointer-events:none 的纯展示元素，不该拦住桌面点击 → 不上报
  pets.forEach(p => { if(!(p.trip && p.trip.phase === "away")) add("P", petBoxFor(p)); });
  eggs.forEach(e => out.push("D:" + Math.round(W*e.x - 26) + ","
           + Math.round(GROUND()+2 - 54) + ",52,60"));
  poops.forEach(p => out.push("D:" + Math.round(p.x-28) + ","
           + Math.round(GROUND()+2-28) + ",56,56"));
  return out.join(";");
};
function reportRects(force){
  if(!(window.petHub && window.petHub.setRects)) return;
  const sig = window.pethubRects();
  if(!force && sig === lastRectSig) return;      // 没变化就不发，几乎零开销
  lastRectSig = sig;
  window.petHub.setRects(sig);
}
setInterval(()=>reportRects(false), 120);

// 运行期异常上报（只在 PETHUB_TRACE_CLICK=1 时落盘）：raF 里一旦抛错，画面会整个冻住
window.addEventListener("error", function(e){
  try {
    if(window.petHub && window.petHub.trace)
      window.petHub.trace("JSERR " + e.message + " @" + (e.lineno||"?") + ":" + (e.colno||"?"));
  } catch(_){}
});

// 走动的宠物 120ms 一同步，点下去不会落在已经走开的空位上
let _faceCur = "";
function updateMenuBadge(){
  // 小球右上角的角标：有几个任务在等你
  const b = el("hudBadge");
  if(b){
    let wait = 0; TASKS.forEach(t => { if(t.status === "waiting") wait++; });
    b.textContent = wait > 9 ? "9+" : String(wait);
    b.classList.toggle("on", wait > 0);
  }
  // 小球图案 = 当前宠物（只在真的换了才写 DOM）
  if(_faceCur !== cur){ _faceCur = cur; setHudFace(); }
}
let hudJustDragged = false;

// HUD 头部点击 → 收起/展开
// 收起后是"当前宠物的小球"；展开方向按球在屏幕左右哪半边决定（贴右边就向左长，贴左边就向右长）
function hudPanelW(){ return Math.round(Math.max(240, Math.min(380, W * 0.20))); }
function placeHudPanel(){
  const hud = el("hud"); if(!hud || hud.classList.contains("hidden")) return;
  const r = hud.getBoundingClientRect();
  const pw = hudPanelW();
  const canRight = r.left + pw + 8 <= W;
  const canLeft  = r.right - pw - 8 >= 0;
  let side;
  if(canRight && !canLeft)      side = "hud-left";
  else if(canLeft && !canRight) side = "hud-right";
  else                          side = (r.left < W/2) ? "hud-left" : "hud-right";
  hud.classList.toggle("hud-left",  side === "hud-left");
  hud.classList.toggle("hud-right", side === "hud-right");
}
function setHudFace(){
  const f = el("hudFace"); if(f) f.textContent = PET_FACE[cur] || "🐾";
  document.documentElement.style.setProperty("--pet-accent", (SPECIES[cur] || {}).accent || "#7fa6d0");
  const btn = el("hudShow"); if(btn) btn.title = spName();
}
function collapseHud(){
  hudHidden = true;
  el("hud").classList.add("hidden");
  reportRects(true);
}
function expandHud(){
  hudHidden = false;
  el("hud").classList.remove("hidden");
  placeHudPanel();
  reportRects(true);
}
el("hudHide").onclick = e=>{ e.stopPropagation(); collapseHud(); };
el("hudShow").onclick = ()=>{ if(hudJustDragged) return; expandHud(); };
el("hudShow").addEventListener("mouseenter", ()=>{ if(window.petHub) window.petHub.setInteractive(true); });
el("hudHead").addEventListener("mouseenter", ()=>{ if(window.petHub) window.petHub.setInteractive(true); });
el("hud").addEventListener("mouseleave", ()=>{ if(window.petHub) window.petHub.setInteractive(false); });

// ---------------- 启动 ----------------
// Electron(preload) 与 WebView2 壳都算悬浮模式，不加底色；仅浏览器预览加底色和说明
const floatingShell = !!window.petHub || !!wvHost;
if(!floatingShell){ document.body.classList.add("browser");
  el("noteLine").style.display = ""; }
// 醒来：先读档（多只宠物 + 蛋），再结算离线时间
let savedVer = 0;
try {
  if(window.petHubState){
    const sv = JSON.parse(window.petHubState);
    savedVer = sv.ver || 1;
    if(Array.isArray(sv.pets) && sv.pets.length){
      pets = sv.pets.filter(o => o && SPECIES[o.sp]).map(o => {
        const p = newPet(o.sp, o.x);
        p.id = o.id || p.id;
        p.born = o.born || p.born;
        p.dir = o.dir || 1;
        if(o.st) Object.assign(p.st, o.st);
        p.sick = !!o.sick; p.sickSince = o.sickSince || 0;
        if(typeof o.temper === "number") p.temper = o.temper;
        p.beh = {kind:"idle", until:0};
        return p;
      });
    } else if(sv.cur && SPECIES[sv.cur]){
      // 老版本单只存档：迁移成一只成年宠物
      const p = newPet(sv.cur, .5);
      if(sv.ST) Object.assign(p.st, sv.ST);
      p.sick = !!sv.sick;
      p.born = Date.now() - LIFE.baby*60000 - LIFE.young*60000 - 60000;   // 直接按成年算
      pets = [p];
    }
    if(Array.isArray(sv.eggs)) eggs = sv.eggs.filter(e => e && e.hatchAt > Date.now());
    if(Array.isArray(sv.grave)) graveyard = sv.grave.slice(-20);
    if(Array.isArray(sv.rel)) sv.rel.forEach(r => { if(Array.isArray(r)) relMap.set(r[0], r[1]); });
  }
} catch(e){}
if(!pets.length && !eggs.length) pets = [newPet(Object.keys(SPECIES)[Math.floor(Math.random()*7)], .5)];
if(pets.length) bindActive(0);
try { applyAway(window.petHubState ? JSON.parse(window.petHubState) : null); } catch(e){}
applyLang();            // 启动时按保存的语言刷新全部文案
setTimeout(()=>{
  say(awayGreeting(), spName());
  if(awayInfo){
    const h = awayInfo.hours.toFixed(awayInfo.hours < 10 ? 1 : 0);
    toast(`<b>🌙</b> ${T().lines.awayToast(h)} · ` +
      `${T().stats.satiety} -${awayInfo.dS} · ${T().stats.mood} -${awayInfo.dM}` +
      (awayInfo.poops ? ` · 💩×${awayInfo.poops}` : ""));
  }
}, 1200);
setInterval(saveState, 60000);      // 每分钟存一次，突然断电也不至于全丢
setTimeout(()=>{ say(timeLine(), spName()); }, 9000);   // 开机后报一次日期/星期/安装天数
connectBridge();
renderHUD();
setInterval(renderHUD, 30000);        // 每 30 秒刷新文案（静默状态会随事件老化而变化）
</script>
