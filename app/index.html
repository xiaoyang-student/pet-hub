<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family:"Microsoft YaHei", system-ui, sans-serif; user-select:none; }
  body.browser { background:linear-gradient(180deg,#141a23 0%,#0d1117 100%); }

  #cv { position:fixed; inset:0; }

  /* ---------- 右上角任务 HUD ---------- */
  /* #hud 是"锚点"（收起时就是那颗小球），面板用绝对定位从锚点向屏幕内侧展开：
     .hud-right → 面板右对齐锚点，向左长；.hud-left → 面板左对齐锚点，向右长。 */
  #hud { position:fixed; top:14px; right:14px; width:34px; z-index:50; }
  .hud-panel { position:absolute; top:0; width:var(--hud-w,300px);
    background:rgba(16,21,28,.88); border:1px solid rgba(120,150,190,.22);
    border-radius:12px; backdrop-filter:blur(10px); box-shadow:0 6px 24px rgba(0,0,0,.35); }
  #hud.hud-left  .hud-panel { left:0; right:auto; }
  #hud.hud-right .hud-panel { right:0; left:auto; }
  .hud-head { display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; }
  .hud-head .t { font-size:12.5px; font-weight:700; color:#dfe8f5; letter-spacing:.5px; flex:1; }
  .hud-head .n { font-size:11px; color:#8fa4c0; }
  .hud-head .tg { font-size:11px; color:#6f86a6; border:1px solid rgba(120,150,190,.25);
    border-radius:6px; padding:1px 7px; }
  .hud-head .tg:hover { color:#cfe0f5; border-color:#7fa6d0; }
  .plat { border-top:1px solid rgba(120,150,190,.12); }
  .plat-head { display:flex; align-items:center; gap:8px; padding:7px 12px; cursor:pointer; }
  .plat-head:hover { background:rgba(255,255,255,.04); }
  .plat-dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .plat-name { font-size:12px; color:#c7d4e6; font-weight:600; flex:1; }
  .plat-sum { font-size:11px; color:#7d90ad; }
  .plat-arrow { font-size:10px; color:#5d7291; width:12px; text-align:center; }
  .tasks { padding:2px 10px 9px; display:none; }
  .plat.open .tasks { display:block; }
  .task { padding:5px 2px 7px; border-top:1px dashed rgba(120,150,190,.10); cursor:pointer; }
  .task:first-child { border-top:none; }
  .task-row { display:flex; align-items:center; gap:7px; }
  .task-ico { font-size:11px; width:14px; text-align:center; flex:none; }
  .task-title { font-size:12px; color:#dde6f2; flex:1; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .task-pct { font-size:11px; color:#8fa4c0; flex:none; }
  .bar { height:4px; border-radius:3px; background:rgba(255,255,255,.08);
    margin-top:5px; overflow:hidden; position:relative; }
  .bar i { display:block; height:100%; border-radius:3px; transition:width .5s; }
  .bar.indet i { width:36% !important; animation:slide 1.2s linear infinite; }
  @keyframes slide { from{transform:translateX(-111.111%)} to{transform:translateX(305.556%)} }
  .task-wait .task-title { color:#ffc861; }
  .task-wait .bar { background:rgba(255,200,97,.15); }
  .task-err .task-title { color:#ff7a6e; }
  .task-done .task-title { color:#8fe3a8; }
  .task-msg { font-size:10.5px; color:#7286a3; margin-top:3px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .hud-mini { display:none; }
  #hud.hidden .hud-panel { display:none; }
  #hud.hidden .hud-mini { display:block; }
  /* 收起后的小球：图案跟着当前宠物变，外圈用宠物的主色 */
  .hud-mini-btn { position:relative; width:38px; height:38px; border-radius:50%;
    background:rgba(16,21,28,.88); border:2px solid var(--pet-accent,#7fa6d0);
    font-size:19px; line-height:1; cursor:pointer; display:flex; align-items:center;
    justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.4); transition:transform .15s;
    -webkit-user-select:none; }
  .hud-mini-btn:hover { transform:scale(1.08); }
  .hud-mini-btn .badge { position:absolute; top:-4px; right:-4px; min-width:15px; height:15px;
    border-radius:8px; background:#ffc861; color:#241a00; font-size:9.5px; font-weight:700;
    display:none; align-items:center; justify-content:center; padding:0 3px; }
  .hud-mini-btn .badge.on { display:flex; }

  /* ---------- 宠物气泡 ---------- */
  #bubble { position:fixed; z-index:60; max-width:240px; background:rgba(240,246,255,.96);
    color:#1c2530; font-size:13px; line-height:1.5; padding:8px 12px; border-radius:12px;
    border-bottom-left-radius:4px; box-shadow:0 4px 16px rgba(0,0,0,.3);
    opacity:0; transform:translateY(6px); transition:.25s; pointer-events:none; }
  #bubble.show { opacity:1; transform:translateY(0); }
  #bubble .from { display:block; font-size:10px; color:#7a8aa0; margin-top:3px; }

  /* ---------- 右键菜单 ---------- */
  #menu { position:fixed; z-index:70; min-width:148px; background:rgba(20,26,35,.96);
    border:1px solid rgba(120,150,190,.25); border-radius:10px; padding:5px; display:none;
    box-shadow:0 8px 28px rgba(0,0,0,.45); }
  #menu .mi { padding:7px 12px; border-radius:7px; font-size:13px; color:#dbe5f2;
    cursor:pointer; display:flex; gap:9px; align-items:center; }
  #menu .mi:hover { background:rgba(110,150,210,.18); }
  #menu .mi.dis { opacity:.4; pointer-events:none; }
  #menu .sep { height:1px; background:rgba(120,150,190,.15); margin:4px 6px; }

  /* ---------- 提示条 ---------- */
  #toasts { position:fixed; left:14px; top:14px; z-index:55; display:flex;
    flex-direction:column; gap:6px; }
  .toast { background:rgba(16,21,28,.88); border:1px solid rgba(120,150,190,.22);
    border-radius:10px; padding:7px 12px; font-size:12px; color:#d5e0ef;
    animation:tin .25s; max-width:320px; }
  @keyframes tin { from{opacity:0; transform:translateX(-12px)} }
  .toast b { color:#ffd479; }
  .note { position:fixed; left:14px; bottom:10px; font-size:10.5px; color:rgba(140,160,190,.5);
    z-index:40; }
</style>
</head>

const T = () => I18N[LANG] || I18N.zh;                       // 当前语言包
function sp(){ return T().species[cur] || SPECIES[cur]; }     // 当前物种的本地化数据
function spName(){ return sp().name || SPECIES[cur].name; }
function spLine(kind){
  const arr = sp()[kind] || SPECIES[cur][kind + "Lines"] || ["…"];

}

let USAGE = [];                       // 壳层推送的今日前台应用时长 [{n,s}]
window.__usage = list => { USAGE = list || []; };

function daysSinceInstall(){
  const t = window.petHubInstalledAt || 0;
  if(!t) return 0;
  return Math.max(1, Math.floor((Date.now() - t) / 86400000) + 1);
}
const APP_CN = { Code:"VS Code", code:"VS Code", devenv:"Visual Studio", chrome:"Chrome",
  msedge:"Edge", WeChat:"微信", Weixin:"微信", QQ:"QQ", EXCEL:"Excel", WINWORD:"Word",

  Doubao:"豆包", ChatGPT:"ChatGPT", wps:"WPS", explorer:"资源管理器" };
function appName(n){ return APP_CN[n] || n; }

// 好玩的"报时"：按日期/星期/时段各来一句，且带安装天数
function timeLine(){
  const d = new Date(), L = T();
  const hh = d.getHours(), wd = d.getDay();
  const md = LANG === "en" ? `${d.getMonth()+1}/${d.getDate()}` : `${d.getMonth()+1}月${d.getDate()}日`;
  const dayN = daysSinceInstall();
  const WD = LANG === "en"
    ? ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][wd]
    : ["周日","周一","周二","周三","周四","周五","周六"][wd];
  const zh = LANG !== "en";
  let s;
  if(zh){
    if(hh >= 23 || hh < 5) s = "都这么晚了，你还不睡？我陪是陪，但明天会困的。";
    else if(hh < 8)  s = "这么早就开工，你是不是没睡醒？";
    else if(hh >= 11 && hh < 13) s = "午饭时间到了，先吃饭再卷。";
    else if(hh >= 17 && hh < 19) s = "下班档口，今天的任务收尾了吗？";
    else if(wd === 5 && hh >= 18) s = "周五晚上！该松口气了。";
    else if(wd === 1 && hh < 11) s = "周一早上，我先替你叹口气。";
    else if(wd === 0 || wd === 6) s = "周末还在忙？那你比我还拼。";
    else s = "又是搬砖的一天，我在旁边看着。";
    if(d.getDate() === 1) s = "本月第一天，新的开始哦。";
  } else {
    if(hh >= 23 || hh < 5) s = "It's late. I'll stay, but you'll be tired tomorrow.";
    else if(hh < 8)  s = "Up this early? You look half asleep.";
    else if(hh >= 11 && hh < 13) s = "Lunch time. Eat first, grind later.";
    else if(hh >= 17 && hh < 19) s = "Wrapping up for the day?";
    else if(wd === 5 && hh >= 18) s = "Friday night! Time to breathe.";
    else if(wd === 1 && hh < 11) s = "Monday morning. I sighed for you.";
    else if(wd === 0 || wd === 6) s = "Working on a weekend? You outdo me.";
    else s = "Another day of work. I'm right here.";
    if(d.getDate() === 1) s = "First day of the month. Fresh start.";
  }
  if(dayN === 7 || dayN === 30 || dayN === 100 || dayN === 365)
    s += zh ? ` 今天是我们在一起的第 ${dayN} 天！` : ` It's our day ${dayN} together!`;
  return `${md} · ${WD} · ${hh}:00 — ${s}`;
}

// 贴心关怀：看今天哪个应用盯太久
let lastCareLine = 0, lastHour = new Date().getHours();
function careLine(){
  if(!USAGE.length) return null;
  const top = USAGE[0];
  if(!top) return null;
  const min = Math.round(top.s / 60), app = appName(top.n);
  const zh = LANG !== "en";
  if(min >= 180) return zh
    ? `${app} 已经开了 ${Math.floor(min/60)} 小时了……你今天真的辛苦了，去喝口水吧。`
    : `${app} has been open for ${Math.floor(min/60)} hours. You've earned a water break.`;
  if(min >= 90) return zh
    ? `你盯着 ${app} ${min} 分钟了，眼睛不酸吗？眨眨眼，看看远处。`
    : `${min} minutes on ${app}. Look away for 20 seconds, will you?`;
  if(min >= 45 && new Date().getHours() >= 22) return zh
    ? `都 ${new Date().getHours()} 点了还在 ${app}，明天再战吧。`
    : `Still on ${app} at this hour. Save some for tomorrow.`;
  return null;
}

    if(hh !== r.h || mm < r.m || mm > r.m + 3) continue;
    if(firedRoutine[r.k]) continue;
    firedRoutine[r.k] = 1;
    const txt = (ROUTINE_TXT[LANG] || ROUTINE_TXT.zh)[r.k];
    if(txt && !sick){                                   // 生病时先惦记身体，别念日程
      say(txt, T().lines.routineTag);
      behavior = {kind:"play", until: now() + 2.5};
    }
    return;
  }
}

// ---------------- 离线记忆：关机那段时间它真的"自己过了一夜" ----------------
let awayInfo = null;                  // 本次启动时的离线结算结果
function clamp100(v){ return Math.max(0, Math.min(100, v)); }

function applyAway(saved){
  if(!saved || !saved.ts) return;
  const hours = Math.min(12, (Date.now() - saved.ts) / 3600000);   // 最多结算 12 小时，绝不"饿死"
  if(hours < 0.05) return;                                          // 3 分钟内不算离开
  let dS = 0, dM = 0;
  pets.forEach(p => {                                               // 每一只都过了一夜
    const st = p.st;
    const s0 = st.satiety, m0 = st.mood;
    st.satiety = clamp100(st.satiety - hours * 4.2);
    st.energy  = clamp100(st.energy  + hours * 3.5);
    st.hygiene = clamp100(st.hygiene - hours * 1.6);
    st.mood    = clamp100(st.mood    - hours * 2.2 - (st.satiety < 30 ? 6 : 0));
    if(st.satiety < 10) st.health = clamp100(st.health - hours * 1.0);
    dS = Math.max(dS, s0 - st.satiety); dM = Math.max(dM, m0 - st.mood);
  });
  const n = Math.min(5, Math.floor(hours / 2.2));                   // 攒下的排泄物
  for(let i = 0; i < n; i++)
    poops.push({ x: Math.max(80, Math.min((W||1200) - 80, 120 + Math.random()*((W||1200) - 240))),
                 t: Date.now(), sp: (pets[i % pets.length] || {}).sp });
  awayInfo = { hours, dS:Math.round(dS), dM:Math.round(dM), poops:n };
  if(pets.length) bindActive(activeIdx);
}

// 把 {platform,status,title,message} 翻译成"人话"，同一状态多套说法轮换
const PLAT_LABEL = {"workbuddy":"WorkBuddy","qoder":"Qoder","claude code":"Claude Code",
  "claudecode":"Claude Code","codex":"Codex","cursor":"Cursor","copilot":"Copilot",
  "unknown":"未知平台","桌面观察":"桌面观察"};
function platName(p){
  const k = String(p||"").trim();
  return PLAT_LABEL[k.toLowerCase()] || k;
}

// 这类标题是"没有信息量"的占位（会话 main / session xxx），不值得念出来
function subjectOf(t){
  const s = String(t.title||"").trim();
  if(!s) return "";
  if(/^(会话\s*\w*|session\s*\w*|main|task|未命名任务)$/i.test(s)) return "";
  if(/会话$/.test(s) && s.length <= 10) return "";
  return s.length > 12 ? s.slice(0,12) + "…" : s;
}

// "在等你" 还是 "在问你"：授权/询问/选择 都算提问
const ASK_RE = /授权|询问|permission|approve|confirm|确认|consent|是否|要不要|可以吗|行吗|y\/n|yes\s*or\s*no|AskUserQuestion|ExitPlanMode|批准|选择|拍板|建议/i;
function flavorOf(t){
  if(["stalled", "denied", "idle", "observing", "cancelled"].includes(t.phase)) return t.phase;
  if(t.status === "waiting"){
    if(t.ask || t.phase === "asking") return "ask";
    if(!t.phase && ASK_RE.test(String(t.message||"") + " " + String(t.title||""))) return "ask";
    return "waiting";
  }
  // 平台只报"运行中"，但很久没有新事件 → 推断它停住了（不敢断言是在问你）
  if((t.status === "running" || t.status === "thinking")
     && (Date.now()/1000 - (t.ts||0)) > 100) return "idle";
  return t.status || "running";
}

function hash32(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function fill(tpl, t){
  const P = platName(t.platform), S = subjectOf(t);
  const M = Math.max(1, Math.round((Date.now()/1000 - (t.ts||0)) / 60));
  return tpl.replace("{P}", P).replace("{S}", S ? "「" + S + "」" : "")
            .replace("{M}", M)
            .replace(/\s{2,}/g, " ").trim();
}
// fresh=true 每次换一种说法（宠物播报）；否则按时间缓慢轮换（HUD，约 45 秒一换）
const TASK_PHASE_TEXT = {
  received: ["已接题", "Prompt received"], thinking: ["思考中", "Thinking"],
  tool: ["执行工具", "Running tool"], editing: ["修改文件", "Editing files"],
  answering: ["回答中", "Answering"], asking: ["等待你确认", "Needs your confirmation"],
  denied: ["授权已拒绝", "Permission denied"], done: ["本轮已完成", "Turn completed"],
  stalled: ["暂无新动作，尚未确认结束", "No new activity; completion unconfirmed"],
  error: ["出错", "Error"], idle: ["未确认正在执行任务", "No confirmed active task"],
  observing: ["仅检测到软件活动", "Only application activity detected"],
  cancelled: ["本轮已取消", "Turn cancelled"]
};
function phraseFor(t, fresh){
  if(Object.hasOwn(TASK_PHASE_TEXT, t.phase)){
    return platName(t.platform) + " · " + TASK_PHASE_TEXT[t.phase][LANG === "en" ? 1 : 0];
  }
  const kind = flavorOf(t);
  const pool = T().pool[kind] || T().pool.running;
  const salt = (t.platform||"") + "|" + (t.id||"") + "|" + kind;
  const idx = fresh ? Math.floor(Math.random()*pool.length)
                    : (hash32(salt) + Math.floor(Date.now()/45000)) % pool.length;
  return fill(pool[idx], t);
}
function exclaim(s){ return /[？?！!～~]$/.test(s) ? s : s + "！"; }

const taskNotices = new Map();

function taskKey(t){ return t.platform + "::" + (t.id || t.title); }

function applySnapshot(snap){
  TASKS.clear();
  (snap.tasks || []).forEach(raw => {
    const t = normalize(raw);
    TASKS.set(taskKey(t), t);
    recordTaskNotice(t);
  });
  renderHUD();
}
function normalize(t){
  return { platform:t.platform||"unknown", id:t.id||"", title:t.title||"未命名任务",
    status:t.status||"running", progress:(t.progress==null?null:Math.max(0,Math.min(100,+t.progress))),
    phase:String(t.phase||"").slice(0,24), tool:String(t.tool||"").slice(0,100),
    turn:String(t.turn||"").slice(0,200), terminal:!!t.terminal,
    message:t.message||"", ask:!!t.ask, ts:t.ts||Date.now()/1000 };
}
function htmlText(value){
  return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[ch]));
}
function inactiveTask(t){
  return ["idle", "observing", "cancelled", "stalled"].includes(t.phase);
}

function recordTaskNotice(t){
  const key = taskKey(t) + "|" + t.turn;
  if(!["done", "waiting", "error"].includes(t.status)){
    if(!t.terminal) taskNotices.delete(key);
    return false;
  }
  const changed = taskNotices.get(key) !== t.status;
  taskNotices.set(key, t.status);
  while(taskNotices.size > 512) taskNotices.delete(taskNotices.keys().next().value);
  return changed;
}
function onEvent(ev){
  if(ev.type === "snapshot"){ applySnapshot(ev); return; }
  if(ev.type === "task"){
    const t = normalize(ev.task), old = TASKS.get(taskKey(t));
    if(old && old.turn && old.turn === t.turn && (old.terminal || old.status === "done")) return;
    TASKS.set(taskKey(t), t);
    if(recordTaskNotice(t)) announce(t.status, t);
    renderHUD();
  }
  if(ev.type === "removed"){ TASKS.delete(ev.key); renderHUD(); }
}

// 任务完成/卡住时宠物播报（每次随机换一种说法）
function announce(kind, t){
  const p = phraseFor(t, true);
  if(kind === "done"){
    ST.mood = Math.min(100, ST.mood + 3);
    doneToday++;
    say(exclaim(p));
    toast(`<b>✅ ${htmlText(platName(t.platform))}</b> · ${htmlText(p)}`);
  } else if(kind === "waiting"){
    const ask = flavorOf(t) === "ask";
    say(exclaim(p) + (ask ? (LANG === "en" ? " Go click it!" : " 快去点它！")
                          : (LANG === "en" ? " Go have a look!" : " 去看看吧！")));
    toast(`<b>${ask ? "🙋" : "⏸️"} ${htmlText(platName(t.platform))}</b> · ${htmlText(p)}`);
  } else if(kind === "error"){
    say(LANG === "en" ? `Uh oh... ${p}, want to take a look?` : `呜……${p}，要看看吗？`);
    toast(`<b>❌ ${htmlText(platName(t.platform))}</b> · ${htmlText(p)}`);
  }
}

function groupByPlat(){
  const g = new Map();
  TASKS.forEach(t => {
    const platform = platName(t.platform);
    if(!g.has(platform)) g.set(platform, []);
    g.get(platform).push(t);
  });
  return g;
}

function renderHUD(){
  const doneT = Date.now()/1000 - 60;    // 完成/报错 60 秒后从显示中移除
  [...TASKS].forEach(([k,t]) => {
    if((t.status==="done"||t.status==="error") && t.ts < doneT) TASKS.delete(k);
  });
  const g = groupByPlat();
  const list = el("platList");
  let total = TASKS.size;
  const today = new Date().getDate();
  if(today !== todayDay){ todayDay = today; doneToday = 0; }   // 跨天清零
  el("hudN").textContent = total
    ? T().ui.tasks(total) + (doneToday ? " · " + T().ui.today(doneToday) : "") : "";

  let html = "";
  for(const [plat, arr] of g){
    if(!Object.hasOwn(hudOpen, plat)) hudOpen[plat] = arr.some(t=>t.status==="waiting");
    const wait = arr.filter(t=>t.status==="waiting").length;
    const askN = arr.filter(t=>t.status==="waiting" && flavorOf(t)==="ask").length;
    const waitN = wait - askN;
    const run = arr.filter(t=>(t.status==="running"||t.status==="thinking") && !inactiveTask(t)).length;
    const done = arr.filter(t=>t.status==="done").length;
    const errors = arr.filter(t=>t.status==="error").length;
    const inactive = arr.filter(t=>inactiveTask(t)).length;
    const SU = T().sum;
    const sum = [run?SU.busy(run):"", askN?SU.ask(askN):"", waitN?SU.wait(waitN):"",
                 done?SU.done(done):"", errors?`${errors} ${LANG==="en"?"failed / denied":"异常 / 拒绝"}`:"",
                 inactive?`${inactive} ${LANG==="en"?"inactive / unconfirmed":"未活动 / 未确认"}`:""]
      .filter(Boolean).join(" · ") || SU.idle;
    html += `<div class="plat ${hudOpen[plat]?"open":""}" data-p="${htmlText(plat)}">
      <div class="plat-head">
        <div class="plat-dot" style="background:${platColor(plat)}"></div>
        <div class="plat-name">${htmlText(platName(plat))}</div>
        <div class="plat-sum">${sum}</div><div class="plat-arrow">${hudOpen[plat]?"▾":"▸"}</div>
      </div>
      <div class="tasks">` +
      arr.map(t=>{
        const m = STATUS_META[t.status] || STATUS_META.running;
        const indet = (t.status==="running"||t.status==="thinking") && !inactiveTask(t) && t.progress==null;
        const pct = indet ? "" : (t.progress==null ? (t.status==="done"?"100":"") : Math.round(t.progress)+"%");
        const width = t.progress!=null ? t.progress : (t.status==="done"?100:(t.status==="error"?100:8));
        return `<div class="task ${t.status==="waiting"?"task-wait":""} ${t.status==="error"?"task-err":""} ${t.status==="done"?"task-done":""}"
             data-k="${htmlText(taskKey(t))}" title="${htmlText(phraseFor(t) + " · " + t.title + (t.message?" · "+t.message:""))}">
          <div class="task-row">
            <div class="task-ico">${m.ico}</div>
            <div class="task-title">${htmlText(phraseFor(t))}</div><div class="task-pct">${pct}</div>
          </div>
          <div class="bar ${indet?"indet":""}"><i style="width:${width}%;background:${m.col}"></i></div>
          ${t.message?`<div class="task-msg">${htmlText(t.message)}</div>`:""}
        </div>`;
      }).join("") +
      `</div></div>`;
  }
  html = html || `<div style="padding:10px 12px;font-size:11.5px;color:#7286a3">${T().ui.noTask}</div>`;
  if(html !== lastHudHTML){
    list.innerHTML = html;
    lastHudHTML = html;

    list.querySelectorAll(".plat-head").forEach(h => h.onclick = () => {
      hudOpen[h.parentElement.dataset.p] = !hudOpen[h.parentElement.dataset.p]; renderHUD();
    });
    list.querySelectorAll(".task").forEach(k => k.onclick = () => {
      const t = TASKS.get(k.dataset.k);
      if(t){ const p = phraseFor(t, true);
        say(t.status==="waiting" ? `${exclaim(p)}${LANG==="en"?" Stop poking my face, go click it!":" 点我脸干嘛，去点它！"}`
          : t.status==="done" ? `${p}`
          : `${p}${t.message ? " · " + t.message : ""}`); }
    });
  }
  reportTasksToShell();
}

// ---------------- 把任务动态甩给壳层（任务栏托盘靠这个活着） ----------------
// 为什么由页面推、而不是壳层自己轮询：页面这条 SSE 是零延迟的，
// 轮询最快也就 3 秒一次。壳层那边还有一路定时兜底，防止页面卡住时托盘僵在旧状态。
let _taskSig = "";
function taskSnapshot(){
  const arr = [];
  TASKS.forEach(t => arr.push({
    p: t.platform, k: t.platform + "::" + t.id, t: t.title,
    s: t.status, g: (t.progress == null ? null : Math.round(t.progress)), m: t.message || ""
  }));
  return {
    tasks: arr,
    waiting: arr.filter(x => x.s === "waiting").length,
    running: arr.filter(x => x.s === "running" || x.s === "thinking").length,
    error:   arr.filter(x => x.s === "error").length,
    done:    arr.filter(x => x.s === "done").length,
    bridge:  bridgeOnline
  };
}
function reportTasksToShell(){
  if(!(window.petHub && window.petHub.tasks)) return;
  if(demoTimer) return;           // 演示任务绝不进托盘：那里必须只有真实状态
  let s;
  try { s = JSON.stringify(taskSnapshot()); } catch(e){ return; }
  if(s === _taskSig) return;      // 没变化就不打扰壳层
  _taskSig = s;
  try { window.petHub.tasks(s); } catch(e){}
}

// 供壳层调用：托盘点一下 = 展开/收起任务面板。
// 必须走 collapseHud/expandHud —— 它们会同步 hudHidden 并强制重算命中区，
// 直接 toggle class 会让壳层不知道面板尺寸变了，鼠标就点不中。
window.pethubToggleHud = function(){
  if(hudHidden) expandHud(); else collapseHud();
  return hudHidden ? "0" : "1";
};
window.pethubHudOpen = function(){ return el("hud").classList.contains("hidden") ? 0 : 1; };
window.pethubTaskCount = function(){ return TASKS.size; };
// 托盘菜单里点某个任务 → 让宠物把那一条念出来
window.pethubSayTask = function(key){
  const t = TASKS.get(key);
  if(!t) return 0;
  const p = phraseFor(t, true);
  say(t.status === "waiting" ? `${exclaim(p)}${t.message ? " · " + t.message : ""}`
    : `${p}${t.message ? " · " + t.message : ""}`);
  return 1;
};
// 第一次进任务栏：提醒一句，不然用户根本不知道图标被 Win11 折进 ^ 里了
window.pethubHintTray = function(){
  say(LANG === "en"
    ? "I moved into the tray — check under ^ if you can't see me."
    : "我住进右下角通知区啦，看不到就点 ^ 把我拖出来～");
  return 1;
};
// 壳层要宠物说句临场的话（比如刚导入了一个应用）
window.pethubSay = function(text){
  try { say(String(text).slice(0, 90)); return 1; } catch(e){ return 0; }
};
// 壳层切换语言：HUD、气泡、台词、日期格式全部跟着换，不刷新页面
window.pethubSetLang = function(l){
  LANG = (l === "en") ? "en" : "zh";
  window.petHubLang = LANG;
  try { document.documentElement.lang = LANG === "en" ? "en" : "zh-CN"; } catch(e){}
  try { renderHUD(); } catch(e){}
  try { say(LANG === "en" ? "OK — English it is." : "好，说中文。"); } catch(e){}
  return LANG;
};

// ---------------- 桥接连接 ----------------
function connectBridge(){
  const es = new EventSource("http://127.0.0.1:8765/api/stream");
  es.addEventListener("snapshot", e => { bridgeOnline = true; stopDemo();
    el("noteLine").textContent = T().ui.connected;
    applySnapshot(JSON.parse(e.data)); });
  es.onmessage = e => { if(!bridgeOnline){ bridgeOnline = true; stopDemo();
    el("noteLine").textContent = T().ui.connected; }
    onEvent(JSON.parse(e.data)); };
  es.onerror = () => {
    if(bridgeOnline){ bridgeOnline = false; reportTasksToShell(); }   // 桥断了要让托盘立刻知道
    else bridgeOnline = false;
    if(!DEMO_ENABLED) el("noteLine").textContent = T().ui.offline;
  };
  // 没连上就如实显示离线；只有显式 ?demo=1 才跑演示数据。
  setTimeout(()=>{
    if(bridgeOnline) return;
    if(DEMO_ENABLED) startDemo();
    else el("noteLine").textContent = T().ui.offline;
  }, 2500);
}

// 内置演示：三个平台模拟
function startDemo(){
  if(demoTimer) return;
  el("noteLine").textContent = T().ui.demo;
  const mk = (plat,id,title,prog,msg)=>({platform:plat,id,title,status:"running",progress:prog,message:msg,ts:Date.now()/1000});
  const demo = {
    "WorkBuddy":[mk("WorkBuddy","w1","整理桌面文件并归档",42,"正在移动 128 个文件"),
                 mk("WorkBuddy","w2","撰写产品周报",10,"收集本周提交记录") ],
    "Claude Code":[mk("Claude Code","c1","重构 pet_kernel 状态机",66,"编辑 pet_kernel.py"),
                   mk("Claude Code","c2","修复 SSE 断线重连",null,"正在思考方案")],
    "Codex":[mk("Codex","x1","编写连接器 SDK 文档",25,"生成 README 草稿")]
  };
  // 已完成任务要显式构造，mk 的第四个参数是进度不是状态
  demo["WorkBuddy"].push({platform:"WorkBuddy", id:"w3", title:"部署前端更新",
    status:"done", progress:100, message:"已发布到生产环境", ts:Date.now()/1000});
  Object.values(demo).flat().forEach(t=>{ demoKeys.push(taskKey(t)); TASKS.set(taskKey(t),t); });
  renderHUD();
  let tick = 0;
  demoTimer = setInterval(()=>{
    tick++;
    TASKS.forEach(t=>{
      if(t.platform==="Codex" && t.id==="x1") return;      // 留一个慢任务
      if(t.status==="running" && t.progress!=null){
        t.progress = Math.min(100, t.progress + 2 + Math.random()*5);
        if(t.progress>=100){ t.status = Math.random()<.12 ? "error" : "done";
          if(t.status==="error") t.message = "权限不足，等待处理";
          t.ts = Date.now()/1000; announce(t.status==="done"?"done":"error", t); }
      } else if(t.status==="done" && tick%40===0 && t.progress!=null){
        t.status="running"; t.progress=5; t.message="新一轮任务"; t.ts=Date.now()/1000;
      }
    });
    // 随机制造一次"等待确认"
    if(tick===14){
      const t = TASKS.get("WorkBuddy::w2");
      if(t && t.status==="running"){ t.status="waiting"; t.message="需要确认：覆盖 3 个同名文件";
        t.ts=Date.now()/1000; announce("waiting", t); }
    }
    if(tick===30){ const t=TASKS.get("WorkBuddy::w2");
      if(t){ t.status="running"; t.message="确认完成，继续执行"; t.ts=Date.now()/1000; } }
    TASKS.forEach(t=>{ if((t.status==="done"||t.status==="error") && Date.now()/1000 - t.ts > 60) TASKS.delete(taskKey(t)); });
    renderHUD();
  }, 900);
}
function stopDemo(){
  if(demoTimer){ clearInterval(demoTimer); demoTimer = null; }
  if(demoKeys.length){
    demoKeys.forEach(k => TASKS.delete(k));
    demoKeys = [];
    renderHUD();
  }
}

// ---------------- 状态层（多只宠物 + 生命周期） ----------------
/* 一只宠物 = 一个对象。所有"当前操作的那只"通过 bindActive(i) 投影到一排老变量上，
   这样绘制/交互/动作仍可以沿用单只时代的写法，而每只宠物各自保留自己的状态。 */
const MAX_PETS = 6;

// 生命周期：孵出 → 幼崽 → 少年 → 成年 → 老年 → 寿终（真实时长，单位：分钟）
const LIFE = {
  hatch:  0.5,    // 蛋 → 幼崽
  baby:   25,     // 幼崽期
  young:  90,     // 少年期
  adult:  600,    // 成年期（能生崽）
  elder:  240,    // 老年期
  // 成年 + 老年之后自然寿终：总计约 16 小时
};
const STAGE_SCALE = { baby:0.52, young:0.74, adult:1, elder:0.94 };
// 天生脾气（会在此基础上随机漂移）
const TEMPER_BASE = { cat:.55, dog:.35, rabbit:.22, snake:.45, spider:.5, chicken:.78, duck:.4 };

let pets = [];                 // 活的宠物
let eggs = [];                 // {x, sp, bornAt, hatchAt, parents}
let graveyard = [];            // 已经离开的（留个纪念，不显示）
let activeIdx = 0;

// —— 以下这排变量是"当前宠物"的投影，老代码全部依赖它们 ——
let ST = { satiety:72, energy:80, mood:75, hygiene:88, health:100 };
let sick = false, sickSince = 0;
let poops = [];                      // {x, y}
let poopCooldown = 0;                // 秒，喂食后倒计时
let behavior = {kind:"idle", until:0};
let px = 0.5, dir = 1, petSize = 1.0;
let petLift = 0;                     // 被拎起的高度
let petAir = 0;                      // 腾空高度：鸡/鸭会飞，兔子会蹦
const CAN_FLY = { chicken:1, duck:1 };
const CAN_HOP = { rabbit:1, cat:1, dog:1 };
let draggingPet = false;
let dragCleanup = null;        // 收尾函数：防止一次没收到 mouseup 就永久卡住 / 挂上第二套监听
let dragWho = null;            // 正在被拖的那只（id）——拖拽时位置以鼠标为准
let kickWarned = false;        // 这只已经警告过"再推就走了"

function newPet(sp, x){
  const now = Date.now();
  return {
    id: "p" + now.toString(36) + Math.floor(Math.random()*1000).toString(36),
    sp, x: (x==null ? 0.2 + Math.random()*0.6 : x),
    y: 1, ty: 1,                                 // 高度：1 = 地面，0 = 屏幕最上面
    dir: Math.random() < .5 ? -1 : 1,
    lift: 0, air: 0,
    beh: { kind:"idle", until:0 },
    born: now,
    st: { satiety:78, energy:82, mood:78, hygiene:90, health:100 },
    sick:false, sickSince:0, poopCd: 60 + Math.random()*40,
    // 脾气：0 温顺 … 1 火药桶。物种底色 + 个体随机
    temper: Math.min(1, Math.max(0, (TEMPER_BASE[sp] || .5) * .6 + Math.random() * .6)),
    soc: null,                                   // 正在进行的互动 {kind,with,until,tx}
    lastTick: now,
  };
}
function petAgeMin(p){ return (Date.now() - p.born) / 60000; }
function petStage(p){
  const a = petAgeMin(p);
  if(a < LIFE.baby)  return "baby";
  if(a < LIFE.baby + LIFE.young) return "young";
  if(a < LIFE.baby + LIFE.young + LIFE.adult) return "adult";
  return "elder";
}
function petLifespan(){ return LIFE.baby + LIFE.young + LIFE.adult + LIFE.elder; }   // 分钟
function isAdult(p){ const s = petStage(p); return s === "adult"; }

function bindActive(i){
  if(!pets.length) return false;
  activeIdx = Math.max(0, Math.min(pets.length - 1, i));
  const p = pets[activeIdx];
  cur = p.sp;
  ST = p.st;                        // 直接引用，改 ST 就是改这只宠物
  behavior = p.beh;
  // 正在被鼠标拎着的那只：位置由鼠标写在 p.x / p.lift 上（drag 的 place() 每次移动都更新），
  // 这里必须照样同步过来。以前这里图省事直接跳过，结果画第 2、3 只时 px/petLift 还留着
  // 上一只宠物的值，被拖的那只会被画到前一只的位置上（看起来就是"一按就消失"），
  // 松手后 draggingPet 归 false、重新同步，它才"又冒出来"。
  if(draggingPet && dragWho === p.id){
    px = p.x; petLift = p.lift; dir = p.dir; petAir = 0;
  } else {
    px = p.x; dir = p.dir; petLift = p.lift; petAir = p.air;
  }
  sick = p.sick; sickSince = p.sickSince; poopCooldown = p.poopCd;
  return true;
}
function flushActive(){
  if(!pets.length) return;
  const p = pets[activeIdx];
  p.beh = behavior;
  p.x = px; p.dir = dir; p.lift = petLift; p.air = petAir;
  p.sick = sick; p.sickSince = sickSince; p.poopCd = poopCooldown;
}
// 右键菜单是"延迟执行"的：弹出来以后，主循环每帧还会把每只宠物依次 bindActive 一遍，
// 等你点下去时 activeIdx 早已漂到数组末尾那只——于是"给第 1 只治病"，会变成第 3 只回答
// "我很健康，别浪费钱"。菜单必须先记住是针对哪只打开的，执行前把状态切回去。
let menuPet = null;
function menuTarget(){
  if(menuPet && pets.includes(menuPet)){ bindActive(pets.indexOf(menuPet)); return true; }
  return false;
}
let lastPetSay = 0;

const cv = el0("cv"), ctx = cv.getContext("2d");
let W, H, DPR = 1, petScale = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);            // 高分屏清晰度
  W = innerWidth; H = innerHeight;
  cv.width  = Math.round(W * DPR);                            // 内部按 DPR 放大
  cv.height = Math.round(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";      // 显示仍为 CSS 像素
  // 宠物随屏幕尺寸自适应（小屏不挤、大屏不迷你）
  petScale = Math.max(0.75, Math.min(1.4, Math.min(W / 1600, H / 900)));
  // HUD 宽度响应式
  const hw = Math.round(Math.max(240, Math.min(380, W * 0.20)));
  document.documentElement.style.setProperty("--hud-w", hw + "px");
}
addEventListener("resize", resize); resize();

function el0(id){ return document.getElementById(id); }
function el(id){ return document.getElementById(id); }

const GROUND = () => H - 44;                    // 地面＝任务栏上沿
const TOP_Y  = () => Math.max(24, H * 0.055);    // 天花板：屏幕最上面那条看不见的边
// 每只宠物有自己的高度：0 = 屏幕最上面，1 = 地面。
// 以前所有宠物都被钉在任务栏上，屏幕中间和上半部永远走不到。
function petYFor(p){ return TOP_Y() + (GROUND() - TOP_Y()) * (p && p.y != null ? p.y : 1); }
const petX = () => W*px;
const petY = () => petYFor(pets[activeIdx]) - 8;

// 当前这只的身体缩放：随成长阶段变化（幼崽小，成年标准）
function stageScale(){
  const p = pets[activeIdx];
  if(!p) return 1;
  return STAGE_SCALE[petStage(p)] || 1;
}

// 宠物的真实可见包围盒（CSS px）。
// 关键：命中判定和上报给壳的矩形都用它，而不是固定 190px 方框——
// 否则点尾巴/耳朵/喙会"穿"到下面的桌面文件上（点宠物结果开了个文件）。
// 单只宠物的可见包围盒（不依赖"当前宠物"这组全局变量，方便一次算所有宠物）
function petBoxFor(p){
  const b = PET_BOX[p.sp] || PET_BOX.cat;
  const s = 1.25 * petScale * (STAGE_SCALE[petStage(p)] || 1);
  const x0 = b[0] * s, x1 = b[2] * s, y0 = b[1] * s, y1 = b[3] * s;
  const cx = W * p.x, base = petYFor(p) - 8 - p.lift - p.air;
  const left  = cx + (p.dir >= 0 ? x0 : -x1);
  const right = cx + (p.dir >= 0 ? x1 : -x0);
  const top   = base + y0;
  const bottom= base + y1;
  const padX = 8, padTop = 8, padBottom = 4;   // 轻微留白，比"点不中"好
  return { left: left - padX, right: right + padX,
           top: top - padTop, bottom: bottom + padBottom,
           width: (right - left) + padX*2, height: (bottom - top) + padTop + padBottom };
}
function petBox(){
  const p = pets[activeIdx];
  return p ? petBoxFor(p) : { left:0, right:0, top:0, bottom:0, width:0, height:0 };
}

// ---------------- 爬墙：扔到天花板 → 贴着顶边横挪两下 → 顺墙慢慢爬下来 ----------------
// 以前拖拽最多只能把宠物拎起 280px，永远够不到天花板，"扔到顶上"这件事根本发生不了。
// 天花板挂点：让头顶刚好贴在屏幕最上沿，而不是半个脑袋被切在屏幕外
function ceilYFor(p){
  const b = PET_BOX[p.sp] || PET_BOX.cat;
  const s = 1.25 * petScale * (STAGE_SCALE[petStage(p)] || 1);
  const topOff = -b[1] * s + 8;                 // 头顶到"基线"的距离
  const span = GROUND() - TOP_Y();
  return Math.max(0, Math.min(.5, (topOff + 8 + 6 - TOP_Y()) / span));
}
function headTopOf(p, lift){
  const b = PET_BOX[p.sp] || PET_BOX.cat;
  const s = 1.25 * petScale * (STAGE_SCALE[petStage(p)] || 1);
  return petYFor(p) - 8 - (lift || 0) - (-b[1] * s);
}
function startClimb(p){
  if(!p || p.climb) return;
  p.climb = { phase:"hang", t0: Date.now(), toY: .58 + Math.random() * .38 };
  p.y = p.ty = ceilYFor(p);
  p.lift = 0; p.air = 0;
  p.beh = { kind:"climb", until: now() + 40 };
  if(p.soc){                                     // 半路被挂上去，先把话说完的人散开
    const mate = pets.find(x => x.id === p.soc.with);
    if(mate){ mate.soc = null; if(mate.beh.kind === "social") mate.beh = { kind:"idle", until: now()+1 }; }
    p.soc = null;
  }
  speakOnce(T().lines.climbUp);
  reportRects(true);
}
function endClimb(p){
  p.climb = null;
  p.y = p.ty = Math.min(1, p.y);
  p.beh = { kind:"idle", until: now() + 2 };
  speakOnce(T().lines.climbLanded);
}

// ---------------- 气泡（会跟着宠物走，不会停在原地） ----------------
let bubbleTimer = null, bubbleW = 200, bubbleH = 60;
let bubbleFor = null;          // 气泡跟着哪只宠物（互动时说话的不一定是当前这只）
function placeBubble(){
  const b = el("bubble");
  if(!b || !b.classList.contains("show")) return;
  // 说话的那只不一定是"当前这只"（比如两只宠物互动时），气泡要贴对地方
  const box = (bubbleFor && pets.includes(bubbleFor)) ? petBoxFor(bubbleFor) : petBox();
  const cx = (box.left + box.right) / 2;
  let x = cx + 26;                                  // 默认在宠物右侧
  if(x + bubbleW > W - 10) x = cx - bubbleW - 26;   // 贴右边就翻到左侧
  x = Math.max(10, Math.min(W - bubbleW - 10, x));
  let y = box.top - bubbleH - 8;
  if(y < 10) y = box.bottom + 8;                    // 头顶放不下就挂脚下
  y = Math.max(10, Math.min(H - bubbleH - 10, y));
  b.style.left = x + "px";
  b.style.top  = y + "px";
}
function say(text, from, who){
  const b = el("bubble");
  bubbleFor = who || null;
  b.innerHTML = htmlText(text) + `<span class="from">${htmlText(from || (spName() + " · " + T().stats.mood + " " + Math.round(ST.mood)))}</span>`;
  b.classList.add("show");
  bubbleW = Math.min(250, Math.max(120, b.offsetWidth || 200));   // 量一次，之后每帧只挪位置
  bubbleH = Math.max(34, b.offsetHeight || 60);
  placeBubble();
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(()=>b.classList.remove("show"), 4200);
}

// 行为选择（每秒检查）
function chooseBehavior(){
  const p = pets[activeIdx];
  const sp = SPECIES[cur];
  const ph = dayPhase();
  if(dragWho && p && p.id === dragWho) return;            // 正被拎在手里，别自己决定去哪儿
  if(grab && grab.p === p) return;                        // 正叼着指针呢
  if(p && p.climb) return;                                // 正挂在墙上，别打断
  if(p && p.soc) return;                                  // 正在跟同伴互动，别打断
  // 偶尔出门溜达（家里至少留一只陪主人）
  if(p && !p.trip && pets.filter(q => !q.trip).length >= 2 && Math.random() < .012){
    startTrip(p); return;
  }
  if(sick){ behavior = {kind:"sick", until:now()+3}; return; }
  if(ST.energy < 22){ if(p) p.ty = 1; behavior = {kind:"sleep", until:now()+8}; return; }
  // 换高度溜达：飞到半空、爬上半屏、回地面（会飞/会跳的敢上更高）
  if(p && Math.random() < .22){
    const rr = Math.random();
    const dare = (!!CAN_FLY[cur] || !!CAN_HOP[cur]) ? .06 : .24;
    if(rr < .32)      p.ty = 1;
    else if(rr < .66) p.ty = .42 + Math.random() * .26;
    else              p.ty = dare + Math.random() * .18;
  }
  // 时段作息：深夜/夜里犯困概率大幅上升（养宠物的一天）
  if(Math.random() < ph.sleep && ST.energy < 80){ behavior = {kind:"sleep", until:now()+8+Math.random()*6}; return; }
  if(ST.satiety < 30){ behavior = {kind:"beg", until:now()+4}; return; }
  if(ST.hygiene < 30 && Math.random()<.5){ behavior = {kind:"groom", until:now()+4}; return; }
  const r = Math.random();
  const canFly = !!CAN_FLY[cur], canHop = !!CAN_HOP[cur];
  // 附近有同伴时，有概率主动凑过去（否则自由散步永远撞不到一起）
  const mate = nearestMate(pets[activeIdx]);
  if(mate && mate.d > .04 && mate.d < .22 && r < .34){
    behavior = { kind:"walk", until:now() + 3 + Math.random()*2 };
    dir = mate.p.x > px ? 1 : -1;
    // 顺便降到对方那一层：一个在半空一个在地上，永远搭不上话
    const myY = p && p.y != null ? p.y : 1, mY = mate.p.y != null ? mate.p.y : 1;
    if(p && Math.abs(myY - mY) > .12) p.ty = mY;
    return;
  }
  if(canFly && r < .18)       behavior = {kind:"fly",  until:now()+3.5+Math.random()*3};
  else if(canHop && r < .30)  behavior = {kind:"hop",  until:now()+2.5+Math.random()*2};
  else if(r < .58)            behavior = {kind:"walk", until:now()+4+Math.random()*4};
  else if(r < .82)            behavior = {kind:"idle", until:now()+3+Math.random()*3};
  else                        behavior = {kind:"play", until:now()+3+Math.random()*2};
}
const now = () => performance.now()/1000;

// ---------------- 生命周期：长大 / 下崽 / 离开 ----------------
let breedAt = 0;                     // 两只成年宠物"相处"到这个时刻就下蛋
let lastStageNote = {};
function speakOnce(text){            // 多只宠物时不让它们同时抢话
  if(Date.now() - lastPetSay < 2500) return;
  lastPetSay = Date.now();
  say(text);
}
function spawnPet(sp, x){
  if(pets.length >= MAX_PETS) return null;
  const p = newPet(sp, x);
  pets.push(p);
  return p;
}
function layEgg(){
  const adults = pets.filter(isAdult);
  if(!adults.length) return;
  const mom = adults[Math.floor(Math.random()*adults.length)];
  const dad = adults.find(a => a !== mom) || mom;
  const sp = Math.random() < .5 ? mom.sp : dad.sp;
  eggs.push({ x: Math.max(.08, Math.min(.92, (mom.x + dad.x)/2)), sp,
              bornAt: Date.now(), hatchAt: Date.now() + LIFE.hatch*60000 });
  speakOnce(T().lines.layEgg(spName()));
  toast(`<b>🥚</b> ${T().lines.eggToast(SPECIES[sp].name || sp)}`);
}
function hatchEgg(i){
  const e = eggs[i];
  eggs.splice(i, 1);
  const p = spawnPet(e.sp, e.x);
  if(!p) return;
  speakOnce(T().lines.hatch(SPECIES[p.sp].name));
  toast(`<b>🐣</b> ${T().lines.hatchToast(SPECIES[p.sp].name || p.sp)}`);
}
function petDie(p, reason){
  const idx = pets.indexOf(p);
  if(idx < 0) return;
  // 正在互动的那只走了，对方得马上收场，否则会一直傻站着等
  if(p.soc){
    const mate = pets.find(x => x.id === p.soc.with);
    if(mate){
      mate.soc = null;
      if(mate.beh.kind === "social") mate.beh = { kind:"idle", until: now() + 1 };
      mate.st.mood = Math.max(0, mate.st.mood - 6);
    }
    p.soc = null;
  }
  p.dyingAt = Date.now();
  pets.splice(idx, 1);
  graveyard.push({ sp:p.sp, born:p.born, died:Date.now(), reason });
  for(let k=0;k<7;k++) hearts.push({x: W*p.x + Math.random()*40-20, y: petY()-60, t0: Date.now(), s: Math.random()});
  if(activeIdx >= pets.length) activeIdx = Math.max(0, pets.length-1);
  if(pets.length) bindActive(activeIdx);
  sayOnce(reason === "old" ? T().lines.dieOld(SPECIES[p.sp].name || p.sp)
                           : T().lines.dieWeak(SPECIES[p.sp].name || p.sp));
}
function sayOnce(t){ say(t); }
function maybeBreed(){
  if(pets.length + eggs.length >= MAX_PETS) { breedAt = 0; return; }
  const adults = pets.filter(isAdult);
  const ready = adults.length >= 2 && adults.filter(a => a.st.mood >= 70).length >= 2;
  if(!ready){ breedAt = 0; return; }
  if(!breedAt){
    breedAt = Date.now() + 120000;                       // 相处两分钟后才下蛋
    speakOnce(T().lines.courting());
    return;
  }
  if(Date.now() >= breedAt){ breedAt = 0; layEgg(); }
}

// ---------------- 宠物之间的互动：闻一闻 / 一起玩 / 蹭头 / 吵架 / 打架 ----------------
// 关系按「id 对」累积：-100 是仇人，+100 是好到穿一条裤子。
// 决定一次互动走向的是三者：关系值、双方脾气、是不是刚出生的小崽。
const relMap = new Map();
let nextSocAt = 0;                                   // 全局冷却：不让整屏宠物一起开打
const SOC_ICON = { sniff:"👃", play:"🎵", nuzzle:"❤️", quarrel:"💢", fight:"💥", chat:"💬" };
const SOC_DUR  = { sniff:3.2, play:8, nuzzle:5, quarrel:7, fight:6, chat:11 };

function relKey(a,b){ return a.id < b.id ? a.id + "|" + b.id : b.id + "|" + a.id; }
function getRel(a,b){ const v = relMap.get(relKey(a,b)); return v == null ? 0 : v; }
function bumpRel(a,b,d){
  const k = relKey(a,b);
  relMap.set(k, Math.max(-100, Math.min(100, (relMap.get(k) || 0) + d)));
}
function temper(p){ return p.temper == null ? .5 : p.temper; }   // 0 温顺 … 1 火药桶

// 老大 = 最早出生的那只（活得久就是资历）。打架时它赢。
function bossPet(){
  let b = null;
  for(const p of pets) if(!b || p.born < b.born) b = p;
  return b;
}
// —— 出门溜达：走出屏幕边上消失一阵，回来时可能带回一个新伙伴 ——
function startTrip(p){
  const edge = p.x < .5 ? -1 : 1;
  // 带伙伴回家的概率刻意压低：多数时候只是自己出去转一圈（不然一出门就带一只，太假）
  p.trip = { phase:"out", edge, until:0,
             bring: Math.random() < .12,
             gift:  Math.random() < .32 };
  p.beh = { kind:"walk", until: now() + 60 };
  p.ty = 1;                                        // 出门得先落地
  speakOnce(pickOne(T().lines.tripOuts));
}
function endTrip(p){
  const bring = !!(p.trip && p.trip.bring);
  const gift  = !!(p.trip && p.trip.gift);
  p.trip = null;
  p.beh = { kind:"idle", until: now() + 2 };
  if(bring && pets.length < MAX_PETS){
    const ks = Object.keys(SPECIES);
    const spk = ks[Math.floor(Math.random()*ks.length)];
    const q = spawnPet(spk, Math.max(.08, Math.min(.92, p.x + (p.dir > 0 ? -.12 : .12))));
    if(q){
      say(T().lines.tripFriend(spNameOf({ sp: spk })));
      reportRects(true);
      return;
    }
  }
  p.st.mood = Math.min(100, p.st.mood + 4);
  p.st.satiety = Math.min(100, p.st.satiety + (gift ? 6 : 0));
  say(gift ? T().lines.tripGift : T().lines.tripBack);
}

// 离某只最近的同伴（chooseBehavior 用它决定要不要凑过去）
function nearestMate(p){  if(!p || pets.length < 2) return null;
  let best = null;
  for(const q of pets){
    if(q === p) continue;
    const d = Math.abs(q.x - p.x);
    if(!best || d < best.d) best = { p: q, d };
  }
  return best;
}
// 当前语言下的物种名（SPECIES 里存的是中文原名）
function spNameOf(p){  const t = T().species && T().species[p.sp];
  return (t && t.name) || (SPECIES[p.sp] && SPECIES[p.sp].name) || p.sp;
}
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function startSocial(a, b, kind){
  const dur   = (SOC_DUR[kind] || 4) * 1000;
  const until = Date.now() + dur + 2400;        // 先留两秒走过去，再算互动时长
  // 间距按身体宽度来（一只约 130px）：聊天/亲昵留一点缝，打架就贴脸
  const close = (kind === "fight" || kind === "quarrel") ? .026 : .042;
  const mid   = (a.x + b.x) / 2;
  // 左边那只站左边，右边那只站右边，面对面
  const pa = a.x <= b.x ? a : b, pb = pa === a ? b : a;
  // ready=false：这一阶段只是「走过去」，还没开始互动
  pa.soc = { kind, with: pb.id, until, ready:false, tx: Math.max(.05, Math.min(.95, mid - close)) };
  pb.soc = { kind, with: pa.id, until, ready:false, tx: Math.max(.05, Math.min(.95, mid + close)) };
  pa.beh = { kind:"social", until: now() + (dur + 2400)/1000 };
  pb.beh = { kind:"social", until: now() + (dur + 2400)/1000 };
  pa.dir = 1; pb.dir = -1;
  // 两只先降到同一高度再靠拢：不然一个在天上一个在地上，凑到一起也是"隔空"
  const yMid = ((a.y == null ? 1 : a.y) + (b.y == null ? 1 : b.y)) / 2;
  pa.ty = pb.ty = Math.max(.2, Math.min(1, yMid));
  nextSocAt = Date.now() + 18000 + Math.random() * 34000;
  reportRects(true);
}

// 两只都站定了才开始说话/动手——不然隔着半个屏幕"碰一下脑袋"太出戏
function socialBegin(pa, pb, kind){
  const S = T().lines.soc;
  const mood = p => `${T().stats.mood} ${Math.round(p.st.mood)}`;
  if(kind === "chat"){
    // 八卦模式：一次挑一段对话，两只轮流说，像真的在唠嗑
    const lines = pickOne(GOSSIP_TXT[LANG] || GOSSIP_TXT.zh);
    let k = 0;
    const step = () => {
      if(!pets.includes(pa) || !pets.includes(pb)) return;
      if(!pa.soc || pa.soc.kind !== kind) return;        // 被打断就收声
      if(k >= lines.length) return;
      const who = (k % 2 === 0) ? pa : pb;
      say(S.who(spNameOf(who), lines[k]), spNameOf(who) + " · " + mood(who), who);
      k++;
      if(k < lines.length) setTimeout(step, 2600);
    };
    setTimeout(step, 300);
  } else {
    const lineA = pickOne(S[kind] || S.sniff);
    const lineB = pickOne(S[kind + "2"] || S[kind] || S.sniff);
    say(S.who(spNameOf(pa), lineA), spNameOf(pa) + " · " + mood(pa), pa);
    setTimeout(() => {
      if(kind === "fight") return;                       // 打架顾不上讲话
      if(!pets.includes(pa) || !pets.includes(pb)) return;
      say(S.who(spNameOf(pb), lineB), spNameOf(pb) + " · " + mood(pb), pb);
    }, 2100);
  }

  // 旁边的小家伙会被吓一跳，停下手上的事看一会儿
  if(kind === "fight" || kind === "quarrel"){
    for(const p of pets){
      if(p === pa || p === pb) continue;
      if(Math.abs(p.x - pa.x) < .3 || Math.abs(p.x - pb.x) < .3){
        p.beh = { kind:"idle", until: now() + 2.5 };
        p.st.mood = Math.max(0, p.st.mood - (kind === "fight" ? 2 : 1));
      }
    }
  }
}

// 每帧检查：这两只真的凑到一起了吗？凑到了才把 ready 打开
function socialCheckReady(me){
  if(!me.soc || me.soc.ready) return;
  const o = pets.find(x => x.id === me.soc.with);
  if(!o || !o.soc || o.soc.ready) return;
  // 各自都站到自己的位置上（不是看彼此间距，否则"面对面站好"反而永远判不到）
  const here = p =>
    (p.soc.tx == null || Math.abs(p.x - p.soc.tx) < .012) &&
    (p.ty == null || Math.abs((p.y == null ? 1 : p.y) - p.ty) < .025);
  if(!here(me) || !here(o)) return;
  me.soc.ready = true; o.soc.ready = true;
  socialBegin(me, o, me.soc.kind);
}

// 结算：谁先到期谁结算，结算完两边一起清干净
function endSocial(p){
  const s = p.soc;
  p.soc = null;
  if(p.beh.kind === "social") p.beh = { kind:"idle", until: now() + 1 };
  const other = pets.find(x => x.id === s.with);
  if(!other || !other.soc || other.soc.kind !== s.kind) return;   // 对方已经先结算过了
  other.soc = null;
  if(other.beh.kind === "social") other.beh = { kind:"idle", until: now() + 1 };
  if(!s.ready) return;                       // 没走到一起就到期了：等于什么都没发生

  const a = p, b = other, L = T().lines.soc;
  switch(s.kind){
    case "fight": {
      const boss = bossPet();
      const loser = (a === boss) ? b : (b === boss) ? a : (Math.random() < .5 ? a : b);
      const win   = loser === a ? b : a;
      win.st.mood    = Math.max(0, win.st.mood - 3);
      win.st.energy  = Math.max(0, win.st.energy - 8);
      loser.st.mood  = Math.max(0, loser.st.mood - 11);
      loser.st.health= Math.max(0, loser.st.health - 3);
      loser.st.hygiene = Math.max(0, loser.st.hygiene - 5);
      bumpRel(a, b, -26);
      // 飞溅的毛（用尘土粒子表现）
      for(let k = 0; k < 6; k++)
        hearts.push({ x: W*a.x + Math.random()*90 - 45, y: petY() - 60, t0: Date.now(), s: Math.random(), e:"✳" });
      toast(`<b>💥</b> ${L.fightToast(spNameOf(win))}`);
      break;
    }
    case "quarrel":
      a.st.mood = Math.max(0, a.st.mood - 4);
      b.st.mood = Math.max(0, b.st.mood - 4);
      bumpRel(a, b, -12);
      break;
    case "play":
      a.st.mood = Math.min(100, a.st.mood + 7); b.st.mood = Math.min(100, b.st.mood + 7);
      a.st.energy = Math.max(0, a.st.energy - 5); b.st.energy = Math.max(0, b.st.energy - 5);
      bumpRel(a, b, 12);
      break;
    case "nuzzle":
      a.st.mood = Math.min(100, a.st.mood + 5); b.st.mood = Math.min(100, b.st.mood + 5);
      bumpRel(a, b, 10);
      // 感情到位了才谈得上添丁
      if(isAdult(a) && isAdult(b) && getRel(a,b) > 60 && Math.random() < .22) layEgg();
      break;
    case "chat":
      a.st.mood = Math.min(100, a.st.mood + 3); b.st.mood = Math.min(100, b.st.mood + 3);
      bumpRel(a, b, 6);
      break;
    default:                                   // sniff：只是打个招呼
      a.st.mood = Math.min(100, a.st.mood + 1); b.st.mood = Math.min(100, b.st.mood + 1);
      bumpRel(a, b, 3);
  }
}

// 每秒检查一次：有没有两只凑得够近，可以发生点什么
function trySocial(){
  if(pets.length < 2) return;
  if(Date.now() < nextSocAt) return;
  if(pets.some(p => p.soc)) return;                       // 一次只演一出
  let best = null;
  for(let i = 0; i < pets.length; i++) for(let j = i + 1; j < pets.length; j++){
    const a = pets[i], b = pets[j];
    if(a.trip || b.trip) continue;                          // 出门的不参与
    if(a.climb || b.climb) continue;                        // 挂在墙上的不参与
    if(a.beh.kind === "sleep" || b.beh.kind === "sleep") continue;
    if((a.air || 0) > 12 || (b.air || 0) > 12) continue;   // 正在飞的别搭理
    if(a.lift > 4 || b.lift > 4) continue;                // 被拎在手里的也别烦
    const d = Math.abs(a.x - b.x);
    if(d > .09) continue;                                  // 得先走到够近才算"碰面"
    // 高度也要在同一层：一个半空一个地上，x 再接近也不算碰面
    if(Math.abs((a.y == null ? 1 : a.y) - (b.y == null ? 1 : b.y)) > .16) continue;
    if(!best || d < best.d) best = { a, b, d };
  }
  if(!best) return;
  const { a, b } = best;

  const kids  = petStage(a) === "baby" || petStage(b) === "baby";
  const fresh = Math.min(petAgeMin(a), petAgeMin(b)) < 3;    // 刚来的三分钟先熟悉环境
  const r     = getRel(a, b);
  const wild  = (temper(a) + temper(b)) / 2;
  let kind, p = Math.random();

  if(kids || fresh){
    kind = p < .45 ? "play" : (p < .70 ? "sniff" : (p < .90 ? "nuzzle" : "chat"));
  } else if(r <= -25){
    kind = p < .40 ? "quarrel" : (p < .72 ? "fight" : "sniff"); // 积怨已深，见面就吵
  } else if(r >= 35){
    kind = p < .30 ? "nuzzle" : (p < .55 ? "play" : (p < .80 ? "chat" : "sniff"));
  } else if(p < .16 + wild * .22){
    kind = "quarrel";                                           // 脾气越大越容易呛起来
  } else if(p < .42){
    kind = "chat";                                              // 关系一般的时候最爱八卦
  } else if(p < .64){
    kind = "sniff";
  } else if(p < .86){
    kind = "play";
  } else {
    kind = "nuzzle";
  }
  startSocial(a, b, kind);
}

// 每秒逻辑（每只宠物各过各的）
setInterval(()=>{
  const ph = dayPhase();
  const d = new Date().getDate(), hh = new Date().getHours();
  if(d !== greetDay){ greetDay = d; greetedM = false; greetedN = false; }

  for(let i = pets.length - 1; i >= 0; i--){
    if(i >= pets.length) continue;
    const p = pets[i];
    bindActive(i);
    // 出门在外：只数着时间，代谢/排泄/互动都先停（回来再接着过）
    if(p.trip && p.trip.phase === "away"){
      if(Date.now() > p.trip.until){
        p.trip.phase = "back";
        p.x = p.trip.edge > 0 ? .995 : .005;
        p.dir = -p.trip.edge;
        p.beh = { kind:"walk", until: now() + 30 };
      }
      flushActive();
      continue;
    }
    const sp = SPECIES[cur];
    const stage = petStage(p);
    const act = behavior.kind==="sleep" ? .25 : (behavior.kind==="walk"||behavior.kind==="play" ? 1.4 : 1);
    const youngK = stage === "baby" ? 1.5 : stage === "young" ? 1.2 : 1;   // 小崽儿饿得快
    ST.satiety = Math.max(0, ST.satiety - sp.decay.satiety * act * 0.6 * ph.food * youngK);
    ST.energy  = Math.max(0, Math.min(100, behavior.kind==="sleep"
                ? ST.energy + 2.2 + Math.max(0, ph.energy)
                : ST.energy - sp.decay.energy * act * 0.5 + Math.min(0, ph.energy)));
    ST.mood    = Math.max(0, Math.min(100, ST.mood - sp.decay.mood * .5
                - poops.length * .12 - (sick?0.6:0) + ph.mood));
    ST.hygiene = Math.max(0, ST.hygiene - sp.decay.hygiene * .5 - poops.length * .08);

    // 长大了就说一声
    if(lastStageNote[p.id] && lastStageNote[p.id] !== stage){
      if(stage === "young") speakOnce(T().lines.growYoung(SPECIES[p.sp].name || p.sp));
      if(stage === "adult") speakOnce(T().lines.growAdult(SPECIES[p.sp].name || p.sp));
      if(stage === "elder") speakOnce(T().lines.growElder(SPECIES[p.sp].name || p.sp));
    }
    lastStageNote[p.id] = stage;

    // 排泄（只在地上拉，空中就别扔了）
    if(poopCooldown > 0) poopCooldown -= 1;
    if(poopCooldown <= 0 && ST.satiety > 40 && (p.y == null || p.y > .85)
       && Math.random() < 0.010 && behavior.kind!=="sleep"){
      poops.push({ x: petX() + (Math.random()*60-30), t: Date.now(), sp: cur });
      poopCooldown = 60 + Math.random()*60;
      speakOnce(spLine("poop"));
      ST.hygiene = Math.max(0, ST.hygiene - 3);
    }
    // 踩到排泄物
    if(!sick && behavior.kind==="walk"){
      for(const q of poops){
        if(Math.abs(q.x - petX()) < 30){
          ST.mood = Math.max(0, ST.mood - 4); ST.hygiene = Math.max(0, ST.hygiene - 4);
          speakOnce(T().lines.stepPoop);
          q.x = petX() + dir * -200;
          break;
        }
      }
    }
    // 生病
    if(!sick && (ST.satiety < 12 || ST.hygiene < 12) && Math.random() < 0.02){
      sick = true; sickSince = Date.now();
      speakOnce(T().lines.sickSay(spName()));
      toast(`<b>💉</b> ${T().lines.sickToast(spName())}`);
    }
    if(sick && Date.now() - sickSince > 180000) ST.health = Math.max(0, ST.health - 2);

    // 寿终：自然老去，或者身体彻底垮了
    const ageMin = petAgeMin(p);
    if(ageMin > petLifespan()) { petDie(p, "old"); continue; }
    if(ST.health <= 0)         { petDie(p, "weak"); continue; }

    if(now() > behavior.until) chooseBehavior();
    // 互动到期：结算（可能是这只、也可能是对方先到期，endSocial 内部保证只结算一次）
    if(p.soc && Date.now() > p.soc.until){ endSocial(p); bindActive(i); }
    flushActive();
  }

  // 蛋孵化
  for(let i = eggs.length - 1; i >= 0; i--)
    if(Date.now() >= eggs[i].hatchAt) hatchEgg(i);

  maybeBreed();
  maybeStealCursor();
  trySocial();

  // 全局：报时 / 关怀 / 日程 / 碎碎念（都只让"当前那只"说）
  if(pets.length){
    bindActive(activeIdx);
    const hNow = new Date().getHours();
    if(hNow !== lastHour){ lastHour = hNow; say(timeLine(), spName()); }
    if(Date.now() - lastCareLine > 25 * 60000){
      lastCareLine = Date.now();
      const c = careLine();
      if(c) say(c, T().lines.careTag);
    }
    if(hh >= 23 && !greetedN){ greetedN = true; say(T().lines.goodNight, spName()); }
    routineDue();
    maybeChat();
  } else if(Date.now() - lastEmptyNote > 60000){
    lastEmptyNote = Date.now();          // 一只都没有了：门口会自己来一颗蛋
    eggs.push({ x:.5, sp: Object.keys(SPECIES)[Math.floor(Math.random()*7)],
                bornAt: Date.now(), hatchAt: Date.now() + LIFE.hatch*60000 });
  }
  updateMenuBadge();
}, 1000);
let lastEmptyNote = 0;
