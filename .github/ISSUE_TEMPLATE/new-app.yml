name: 🤖 推荐一款该被跟踪的 AI 软件
description: 你常用的 AI 工具还没被跟踪？告诉我它把日志/数据写在哪儿
title: "[新软件] "
labels: ["new-app"]
body:
  - type: markdown
    attributes:
      value: |
        PetHub 只做一件事：**读应用自己写下来的真实记录**，不猜也不编。
        所以能不能适配一款软件，关键在于**它在本地留下了什么数据**。

  - type: input
    id: app
    attributes:
      label: 软件名称
      placeholder: 例如：Cursor / Trae / 通义灵码
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: 它的数据存在哪（最重要）
      description: |
        常见位置：`%APPDATA%\…`、`%LOCALAPPDATA%\…`、`C:\Users\<你>\.xxx\`、安装目录下的 logs。
        在资源管理器地址栏复制路径贴过来就行，不用懂技术。
      placeholder: 例如：C:\Users\<用户名>\AppData\Roaming\cursor\logs\
    validations:
      required: false

  - type: textarea
    id: sample
    attributes:
      label: 里面长什么样（可选）
      description: 挑两三行贴出来，或者截个图。**别贴密钥、token、隐私内容。**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: help
    attributes:
      label: 参与
      options:
        - label: 我愿意配合测试适配器
        - label: 我愿意自己写这个适配器（见 CONTRIBUTING.md）
