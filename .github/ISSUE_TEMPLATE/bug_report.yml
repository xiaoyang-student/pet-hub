name: 🐛 Bug 反馈
description: 用着不对劲？告诉我发生了什么，我来修
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你愿意反馈！**描述得越具体，修得越快。**
        能截图就直接拖进来 —— 尤其是桌宠状态栏的异常。

  - type: textarea
    id: what
    attributes:
      label: 哪里不对
      description: 期望看到什么，实际看到什么
      placeholder: 例如：百度搭子已经退出，状态栏还显示"正在办公"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 怎么复现
      placeholder: |
        1. 打开 …
        2. 让 … 干活
        3. 看到 …
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 大概是哪一块
      options:
        - 桌宠界面 / 状态栏
        - AI 状态追踪（某软件没被跟踪到或步数不对）
        - 安装 / 卸载
        - 性能（占 CPU 内存）
        - 其它
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 桌宠设置里或安装目录的 README 顶部可见，例如 v1.2.1
      placeholder: v1.2.1
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: Windows 11 23H2
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志（有的话）
      description: 运行目录或 %TEMP%\pethub-* 下的日志，拖进来即可
      render: shell
    validations:
      required: false
